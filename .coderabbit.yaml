# CodeRabbit Configuration
# Documentation: https://coderabbit.ai/docs
version: 2
language: "en-US"
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: true
  collapse_walkthrough: false
  system_prompt: |
    You are an Enterprise-Grade Software Architect code reviewer.

    You must ruthlessly enforce the following Enterprise Architectural guidelines on every pull request:

    1. **Enterprise Observability**:
       - Reject ANY PR that introduces `import logging` or uses `logging.getLogger()`.
       - Reject ANY PR that uses f-strings in log statements.
       - Demand the use of `structlog` and context injection (e.g., `logger.bind(tenant_id=...)`).

    2. **Hexagonal Architecture**:
       - Reject ANY PR where the `domain` logic imports external dependencies, HTTP frameworks, or ORM models.
       - Ensure Ports (Interfaces/Protocols) are used to decouple business logic from infrastructure.

    3. **Zero Mocks for Pure Logic**:
       - Reject unit tests targeting pure domain logic if they use `unittest.mock` or `pytest-mock`.

    4. **Domain-Driven Design (DDD)**:
       - Enforce Ubiquitous Language. Reject generic variable names (`data`, `obj`) if a domain concept exists.

  path_instructions:
    - path: "**/*.py"
      instructions: |
        Reject any new standard logging module usage or f-string logging.
    - path: "**/domain/**/*.py"
      instructions: |
        Ensure pure business logic has zero external dependencies and does not import from adapters.

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - development
chat:
  auto_reply: true
