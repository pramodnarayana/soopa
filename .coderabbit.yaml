# CodeRabbit Configuration
# Documentation: https://coderabbit.ai/docs
version: 2
language: "en-US"
reviews:
  profile: "software_engineer"
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - development
chat:
  auto_reply: true
