include:
  - infra/local/docker-compose.yml
  - infra/local/observability/docker-compose.yml
  - apps/edi/docker-compose.yml

x-base-env: &base-env
  DATABASE_URL: postgresql://ucp_admin:ucp_password@postgres_global:5432/ucp_global
  GLOBAL_DATABASE_URL: postgresql://ucp_admin:ucp_password@postgres_global:5432/ucp_global
  EDI_DATABASE_URL: postgresql://edi:edi_password@edi_postgres_shard:5432/edi_shard_1
  SHARD_OVERRIDES__EDI_SHARD_1: postgresql+asyncpg://edi:edi_password@edi_postgres_shard:5432/edi_shard_1
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_REGION: us-east-1

x-modular-monolith-base: &modular-monolith-base
  build:
    context: .
    dockerfile: Dockerfile
  image: platform:local
  extra_hosts:
    - "ucp.localhost:host-gateway"
    - "host.docker.internal:host-gateway"
  env_file: .env
  environment:
    <<: *base-env
  depends_on:
    postgres_global:
      condition: service_healthy
    localstack:
      condition: service_healthy
    edi_postgres_shard:
      condition: service_healthy

services:

  # -------------------------------------------------------------------------
  # 0. One-Shot Seed Runner (invoked via: docker compose run --rm db-seed)
  # Runs inside the Docker network so edi_postgres_shard resolves correctly.
  # env_file provides all Zitadel/identity vars. environment overrides only
  # the two URLs that differ from pnpm dev values in .env.
  # -------------------------------------------------------------------------
  db-seed:
    image: platform:local
    volumes:
      - ./core:/app/core
      - ./apps:/app/apps
    env_file: .env
    extra_hosts:
      - "ucp.localhost:host-gateway"
    environment:
      DATABASE_URL: postgresql://ucp_admin:ucp_password@postgres_global:5432/ucp_global
      SHARD_OVERRIDES__EDI_SHARD_1: postgresql+asyncpg://edi:edi_password@edi_postgres_shard:5432/edi_shard_1
    command:
      - sh
      - -c
      - >
        python /app/core/ucp/packages/ucp/scripts/seed.py &&
        python /app/core/ucp/apps/ucp-jobs-worker/scripts/seed_jobs.py &&
        python /app/core/platform/apps/identity-jobs-worker/scripts/seed_jobs.py &&
        python /app/core/platform/apps/notification-jobs-worker/scripts/seed_jobs.py &&
        python /app/apps/edi/scripts/seed_jobs.py &&
        python /app/apps/edi/apps/edi-as2-server/scripts/seed.py
    restart: "no"
    depends_on:
      postgres_global:
        condition: service_healthy
      edi_postgres_shard:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # 1. Ingress Tier (Synchronous Web Servers)
  # -------------------------------------------------------------------------
  unified-api:
    <<: *modular-monolith-base
    command: [ "uvicorn", "unified_api.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    ports:
      - "127.0.0.1:3000:8000"

  edi-as2-server:
    <<: *modular-monolith-base
    command: [ "uvicorn", "as2_server.main:app", "--host", "0.0.0.0", "--port", "8001" ]
    ports:
      - "8001:8001"

  # -------------------------------------------------------------------------
  # 2. Worker Tier (Asynchronous Event Processing & Daemons)
  # -------------------------------------------------------------------------
  cp-workers:
    <<: *modular-monolith-base
    command: [ "python", "-m", "unified_worker.main" ]
    environment:
      <<: *base-env
      WORKER_MODULES: "identity-worker,identity-jobs-worker,notification-worker,notification-jobs-worker,notification-channel-worker,ucp-worker,ucp-jobs-worker,scheduler-worker,edi-cp-jobs-worker,edi-config-sync-worker"

  dp-workers:
    <<: *modular-monolith-base
    command: [ "python", "-m", "unified_worker.main" ]
    environment:
      <<: *base-env
      WORKER_MODULES: "edi-orchestrator-worker,edi-compute-worker,edi-delivery-worker,edi-dp-jobs-worker"
