include:
  - infra/local/docker-compose.yml
  - infra/local/observability/docker-compose.yml
  - apps/edi/docker-compose.yml
  - apps/ip/docker-compose.yml

x-base-env: &base-env
  DATABASE_URL: postgresql://ucp_admin:ucp_password@postgres_global:5432/global_db
  GLOBAL_DATABASE_URL: postgresql://ucp_admin:ucp_password@postgres_global:5432/global_db
  EDI_DATABASE_URL: postgresql://edi:edi_password@edi_postgres_shard:5432/edi_shard
  SHARD_OVERRIDES__EDI_SHARD_1: postgresql+asyncpg://edi:edi_password@edi_postgres_shard:5432/edi_shard
  IP_DATABASE_URL: postgresql://ip:ip_password@ip_postgres_shard:5432/ip_shard
  SHARD_OVERRIDES__IP_SHARD_1: postgresql+asyncpg://ip:ip_password@ip_postgres_shard:5432/ip_shard
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_REGION: us-east-1

x-modular-monolith-base: &modular-monolith-base
  build:
    context: .
    dockerfile: Dockerfile
  image: platform:local
  extra_hosts:
    - "ucp.localhost:host-gateway"
    - "host.docker.internal:host-gateway"
  env_file: .env
  environment:
    <<: *base-env
  depends_on:
    postgres_global:
      condition: service_healthy
    localstack:
      condition: service_healthy

services:

  # -------------------------------------------------------------------------
  # 0. One-Shot Seed Runner (invoked via: docker compose run --rm db-seed)
  # -------------------------------------------------------------------------
  db-seed:
    <<: *modular-monolith-base
    volumes:
      - ./core:/app/core
      - ./apps:/app/apps
    environment:
      <<: *base-env
      DATABASE_URL: postgresql://ucp_admin:ucp_password@postgres_global:5432/global_db
      SHARD_OVERRIDES__EDI_SHARD_1: postgresql+asyncpg://edi:edi_password@edi_postgres_shard:5432/edi_shard
      SHARD_OVERRIDES__IP_SHARD_1: postgresql+asyncpg://ip:ip_password@ip_postgres_shard:5432/ip_shard
    command: ["python", "-m", "platform_migrator", "seed", "--domain", "all"]
    restart: "no"

  # -------------------------------------------------------------------------
  # 1. Ingress Tier (Synchronous Web Servers)
  # -------------------------------------------------------------------------
  unified-api:
    <<: *modular-monolith-base
    profiles: ["platform", "ip", "edi"]
    environment:
      <<: *base-env
      ENABLED_APPS: ${ENABLED_APPS:-edi,ip}
    command: [ "uvicorn", "unified_api.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    ports:
      - "127.0.0.1:3000:8000"

  edi-as2-server:
    <<: *modular-monolith-base
    profiles: ["edi"]
    depends_on:
      postgres_global:
        condition: service_healthy
      localstack:
        condition: service_healthy
      edi_postgres_shard:
        condition: service_healthy
    command: [ "uvicorn", "as2_server.main:app", "--host", "0.0.0.0", "--port", "8001" ]
    ports:
      - "8001:8001"

  # -------------------------------------------------------------------------
  # 2. Decoupled Per-Domain Worker Tier (Profile-Scoped)
  # -------------------------------------------------------------------------
  platform-workers:
    <<: *modular-monolith-base
    profiles: ["platform", "ip", "edi"]
    command: [ "python", "-m", "unified_worker.main" ]
    environment:
      <<: *base-env
      WORKER_MODULES: "identity-worker,identity-jobs-worker,notification-worker,notification-jobs-worker,notification-channel-worker,ucp-worker,ucp-jobs-worker,scheduler-worker"

  ip-cp-workers:
    <<: *modular-monolith-base
    profiles: ["ip"]
    command: [ "python", "-m", "unified_worker.main" ]
    environment:
      <<: *base-env
      WORKER_MODULES: "ip-cp-jobs-worker"

  ip-dp-workers:
    <<: *modular-monolith-base
    profiles: ["ip"]
    depends_on:
      postgres_global:
        condition: service_healthy
      localstack:
        condition: service_healthy
      ip_postgres_shard:
        condition: service_healthy
    command: [ "python", "-m", "unified_worker.main" ]
    environment:
      <<: *base-env
      WORKER_MODULES: "ip-orchestrator-worker,ip-delivery-worker,ip-dp-jobs-worker"

  edi-cp-workers:
    <<: *modular-monolith-base
    profiles: ["edi"]
    command: [ "python", "-m", "unified_worker.main" ]
    environment:
      <<: *base-env
      WORKER_MODULES: "edi-cp-jobs-worker,edi-config-sync-worker"

  edi-dp-workers:
    <<: *modular-monolith-base
    profiles: ["edi"]
    depends_on:
      postgres_global:
        condition: service_healthy
      localstack:
        condition: service_healthy
      edi_postgres_shard:
        condition: service_healthy
    command: [ "python", "-m", "unified_worker.main" ]
    environment:
      <<: *base-env
      WORKER_MODULES: "edi-orchestrator-worker,edi-compute-worker,edi-delivery-worker,edi-delivery-dlq-worker,edi-dp-jobs-worker"

  # -------------------------------------------------------------------------
  # 3. Consolidated Worker Containers (Full Multi-App Mode)
  # -------------------------------------------------------------------------
  cp-workers:
    <<: *modular-monolith-base
    profiles: ["full"]
    command: [ "python", "-m", "unified_worker.main" ]
    environment:
      <<: *base-env
      WORKER_MODULES: "identity-worker,identity-jobs-worker,notification-worker,notification-jobs-worker,notification-channel-worker,ucp-worker,ucp-jobs-worker,scheduler-worker,edi-cp-jobs-worker,edi-config-sync-worker,ip-cp-jobs-worker"

  dp-workers:
    <<: *modular-monolith-base
    profiles: ["full"]
    depends_on:
      postgres_global:
        condition: service_healthy
      localstack:
        condition: service_healthy
      edi_postgres_shard:
        condition: service_healthy
      ip_postgres_shard:
        condition: service_healthy
    command: [ "python", "-m", "unified_worker.main" ]
    environment:
      <<: *base-env
      WORKER_MODULES: "edi-orchestrator-worker,edi-compute-worker,edi-delivery-worker,edi-delivery-dlq-worker,edi-dp-jobs-worker,ip-orchestrator-worker,ip-delivery-worker,ip-dp-jobs-worker"
