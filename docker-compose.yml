include:
  - infra/local/docker-compose.yml
  - infra/local/observability/docker-compose.yml
  - apps/edi/docker-compose.yml

# Single image built once, reused by all runtime containers.
# Follows the Shopify-style single-image deployment strategy.
x-monolith-base: &monolith-base
  build:
    context: .
    dockerfile: Dockerfile
  image: platform:local
  env_file: .env
  environment:
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_REGION: us-east-1
    SQS_PROVISIONING_QUEUE_URL: http://localstack:4566/000000000000/edi-config-sync-queue.fifo
    SQS_TRANSFORM_QUEUE_URL: http://localstack:4566/000000000000/edi-transform.fifo
    SQS_LIFECYCLE_QUEUE_URL: http://localstack:4566/000000000000/edi-lifecycle.fifo
    SQS_DELIVER_QUEUE_URL: http://localstack:4566/000000000000/edi-deliver.fifo
    SQS_DATA_PLANE_JOBS_QUEUE_URL: http://localstack:4566/000000000000/edi-data-plane-jobs.fifo
    SQS_CONTROL_PLANE_JOBS_QUEUE_URL: http://localstack:4566/000000000000/edi-control-plane-jobs.fifo
    SQS_UCP_JOBS_QUEUE_URL: http://localstack:4566/000000000000/ucp-jobs.fifo
    SQS_UCP_IDENTITY_SYNC_QUEUE_URL: http://localstack:4566/000000000000/ucp-events.fifo
    SQS_IDENTITY_SYNC_QUEUE_URL: http://localstack:4566/000000000000/identity-events.fifo
    SQS_PRIORITY_NOTIFICATIONS_QUEUE_URL: http://localstack:4566/000000000000/edi-priority-notifications.fifo
    SQS_EMAIL_CHANNEL_QUEUE_URL: http://localstack:4566/000000000000/email-channel.fifo
  depends_on:
    postgres_global:
      condition: service_healthy
    localstack:
      condition: service_healthy
    edi_postgres_shard:
      condition: service_healthy

services:

  # -------------------------------------------------------------------------
  # 1. Ingress Tier (Synchronous Web Servers)
  # -------------------------------------------------------------------------
  unified-api:
    <<: *monolith-base
    command: ["uvicorn", "unified_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  edi-as2-server:
    <<: *monolith-base
    command: ["uvicorn", "as2_server.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"

  # -------------------------------------------------------------------------
  # 2. Worker Tier (Asynchronous Event Processing)
  # -------------------------------------------------------------------------
  edi-orchestrator:
    <<: *monolith-base
    command: ["python", "-m", "worker.main"]

  edi-compute-worker:
    <<: *monolith-base
    command: ["python", "-m", "compute_worker.main"]

  edi-config-sync-worker:
    <<: *monolith-base
    command: ["python", "-m", "config_sync_worker.provision.main"]

  edi-cp-outbox-worker:
    <<: *monolith-base
    command: ["python", "-m", "edi_cp_outbox_worker.main"]

  edi-dp-outbox-worker:
    <<: *monolith-base
    command: ["python", "-m", "edi_dp_outbox_worker.main"]

  edi-cp-cleanup:
    <<: *monolith-base
    command: ["python", "-m", "edi_cp_cleanup.main"]

  ucp-worker:
    <<: *monolith-base
    command: ["python", "-m", "ucp_worker.main"]

  ucp-outbox-worker:
    <<: *monolith-base
    command: ["python", "-m", "ucp_outbox_worker.main"]

  ucp-cleanup:
    <<: *monolith-base
    command: ["python", "-m", "ucp_cleanup.main"]

  identity-worker:
    <<: *monolith-base
    command: ["python", "-m", "identity_worker.main"]

  identity-outbox-worker:
    <<: *monolith-base
    command: ["python", "-m", "identity_outbox_worker.main"]

  identity-cleanup:
    <<: *monolith-base
    command: ["python", "-m", "identity_cleanup.main"]

  # -------------------------------------------------------------------------
  # 3. Replication & Reliability Tier (Background Daemons)
  # -------------------------------------------------------------------------
  notification-worker:
    <<: *monolith-base
    command: ["python", "-m", "notification_worker.main"]

  notification-outbox-worker:
    <<: *monolith-base
    command: ["python", "-m", "notification_outbox_worker.main"]

  notification-email-worker:
    <<: *monolith-base
    command: ["python", "-m", "notification_email_worker.main"]

  notification-cleanup:
    <<: *monolith-base
    command: ["python", "-m", "notification_cleanup.main"]

  # -------------------------------------------------------------------------
  # 4. Scheduler Tier (Cron)
  # -------------------------------------------------------------------------
  scheduler-engine:
    <<: *monolith-base
    command: ["python", "-m", "scheduler_engine.main"]

  edi-dp-cleanup:
    <<: *monolith-base
    command: ["python", "-m", "edi_dp_cleanup.main"]
