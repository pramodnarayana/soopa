[project]
name = "compute_worker"
version = "0.1.0"
description = "Heavy compute worker for EDI transformations"
requires-python = ">=3.11"
dependencies = [
    "ucp_models",
    "transformer",
]

[tool.uv.sources]
ucp_models = { workspace = true }
transformer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_worker"]

[tool.pyright]
venvPath = "../../../../.."
venv = ".venv"
extraPaths = [
    "../../../../core/ucp/packages/models/src",
    "../../../../../core/platform/packages/identity/python/src",
    "../../../../../core/platform/packages/observability/python/src",
    "../../../../../core/platform/packages/schemas/python/src",
    "../../../packages/database/src",
    "../../../packages/pipeline/src",
    "../../../packages/grammar/src",
    "../../../packages/config/src",
    "../../../packages/security/src",
    "../../../packages/patches/src",
    "../../../packages/transformer/src",
    "../../../packages/as2_core/src",
    "../../../packages/bots_core/src",
    "../../../packages/domain/src",
    "src",
    "../ucp-sync/src",
    "../orchestrator/src",
    "../../edi-as2-server/src",
    "../../edi-api/src",
]

[tool.ruff]
extend = "../../../../../pyproject.toml"
