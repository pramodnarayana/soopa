[project]
name = "orchestrator_worker"
version = "0.1.0"
description = "Worker service for handling provisioning and data orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=13.1.1",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    # Local dependencies
    "database",
    "pipeline",
    "config",
    "domain",
    "soopa_schemas",
]

[tool.uv.sources]
database = { workspace = true }
pipeline = { workspace = true }
config = { workspace = true }
domain = { workspace = true }
soopa_schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "aioboto3",
    "aioboto3.*",
    "botocore",
    "botocore.*",
    "hvac",
    "hvac.*",
]
ignore_missing_imports = true

[tool.pyright]
venvPath = "../../../../.."
venv = ".venv"
extraPaths = [
    "../../../../../core/platform/packages/identity/python/src",
    "../../../../../core/platform/packages/observability/python/src",
    "../../../../../core/platform/packages/schemas/python/src",
    "../../../packages/database/src",
    "../../../packages/pipeline/src",
    "../../../packages/grammar/src",
    "../../../packages/config/src",
    "../../../packages/security/src",
    "../../../packages/patches/src",
    "../../../packages/transformer/src",
    "../../../packages/as2_core/src",
    "../../../packages/bots_core/src",
    "../../../packages/domain/src",
    "../compute/src",
    "../ucp-sync/src",
    "src",
    "../../edi-as2-server/src",
    "../../edi-api/src",
]

[tool.ruff]
extend = "../../../../../pyproject.toml"
