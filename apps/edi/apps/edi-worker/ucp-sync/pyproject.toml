[project]
name = "ucp_sync_worker"
version = "0.1.0"
description = "Worker service for synchronizing Identity events from UCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=13.1.1",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    # Local dependencies
    "database",
    "config",
    "domain",
]

[tool.uv.sources]
database = { workspace = true }
config = { workspace = true }
domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pyright]
venvPath = "../../../../.."
venv = ".venv"
extraPaths = [
    "../../../../../core/platform/packages/identity/python/src",
    "../../../../../core/platform/packages/observability/python/src",
    "../../../../../core/platform/packages/schemas/python/src",
    "../../../packages/database/src",
    "../../../packages/pipeline/src",
    "../../../packages/grammar/src",
    "../../../packages/config/src",
    "../../../packages/security/src",
    "../../../packages/patches/src",
    "../../../packages/transformer/src",
    "../../../packages/as2_core/src",
    "../../../packages/bots_core/src",
    "../../../packages/domain/src",
    "../compute/src",
    "src",
    "../orchestrator/src",
    "../../edi-as2-server/src",
    "../../edi-api/src",
]

[tool.ruff]
extend = "../../../../../pyproject.toml"
