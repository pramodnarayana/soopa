[project]
name = "ucp_sync_worker"
version = "0.1.0"
description = "Worker service for synchronizing Identity events from UCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=13.1.1",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    # Local dependencies
    "database",
    "config",
    "domain",
]

[tool.uv.sources]
database = { workspace = true }
config = { workspace = true }
domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
