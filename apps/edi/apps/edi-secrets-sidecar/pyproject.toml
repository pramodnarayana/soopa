[project]
name = "secrets-sidecar"
version = "0.1.0"
description = "Background worker for synchronizing AWS Secrets Manager to local Sidecar volumes"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.28.0",
    "structlog>=24.1.0",
    "edi",
]

[tool.uv.sources]
edi = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py"]
