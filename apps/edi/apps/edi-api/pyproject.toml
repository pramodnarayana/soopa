[project]
name = "api"
version = "0.1.0"
description = "FastAPI Main Gateway for EDI Platform"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "gunicorn>=22.0.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aioboto3>=12.0.0",
    "database",
    "identity",
    "config",
    "observability",
    "security",
    "patches",
    "pipeline",
    "domain",
    "hvac>=2.4.0",
    "cryptography>=41.0.0",
    "httpx>=0.24.1",
    "paramiko>=3.3.1",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "anyio>=3.7.1",
    "as2-core",
    "transformer"
]

[tool.uv.sources]
database = { workspace = true }
identity = { workspace = true }
config = { workspace = true }
observability = { workspace = true }
security = { workspace = true }
patches = { workspace = true }
pipeline = { workspace = true }
domain = { workspace = true }
as2-core = { workspace = true }
transformer = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.deptry]
known_first_party = ["api"]

[tool.deptry.package_module_name_map]
"python-dotenv" = ["dotenv"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "uvicorn",
    "gunicorn",
    "prometheus-client",
    "pydantic-settings",
    "observability"
]

[tool.ruff.lint.per-file-ignores]
"src/api/main.py" = ["B008", "E402"]
"src/api/cdc_relay.py" = ["B008"]
"src/api/routers/**/*.py" = ["B008", "E402"]
"src/api/dependencies/**/*.py" = ["B008"]
"tests/**/*.py" = ["E402"]
