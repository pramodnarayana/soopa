[project]
name = "compute_worker"
version = "0.1.0"
description = "Heavy compute worker for EDI transformations"
requires-python = ">=3.11"
dependencies = ["edi", "aioboto3>=12.0.0", "dotenv", "structlog"]

[tool.uv.sources]
ucp_models = { workspace = true }
edi = { workspace = true }

[tool.deptry]
known_first_party = ["compute_worker"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_worker"]

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../../../core/ucp/packages/models/src",
    "../../../../core/platform/packages/identity/src",
    "../../../../core/platform/packages/observability/python/src",
    "../../../../core/platform/packages/schemas/python/src",
    "../../packages/edi/src",
    "src",
    "../edi-orchestrator-worker/src",
    "../../edi-as2-server/src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
