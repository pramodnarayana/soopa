[project]
name = "as2_server"
version = "0.1.0"
description = "FastAPI HTTP Listener for incoming AS2 messages"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "ucp_models",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "gunicorn>=22.0.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.0",
    "as2-core",
    "security",
    "database",
    "config",
    "observability",
    "sqlalchemy>=2.0.0",
    "orchestrator-worker",
]

[tool.uv.sources]
ucp_models = { workspace = true }
as2-core = { workspace = true }
security = { workspace = true }
database = { workspace = true }
config = { workspace = true }
observability = { workspace = true }
orchestrator-worker = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.deptry]
extend_exclude = ["scripts"]
known_first_party = ["as2_server"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "uvicorn",
    "gunicorn",
    "python-dotenv",
    "prometheus-client"
]

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../../../core/ucp/packages/models/src",
    "../../../../core/platform/packages/identity/src",
    "../../../../core/platform/packages/observability/python/src",
    "../../../../core/platform/packages/schemas/python/src",
    "../../packages/database/src",
    "../../packages/pipeline/src",
    "../../packages/grammar/src",
    "../../packages/config/src",
    "../../packages/security/src",
    "../../packages/patches/src",
    "../../packages/transformer/src",
    "../../packages/as2_core/src",
    "../../packages/bots_core/src",
    "../../packages/domain/src",
    "../edi-worker/compute/src",
    "../edi-worker/ucp-sync/src",
    "../edi-worker/orchestrator/src",
    "src",
    "../edi-api/src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
