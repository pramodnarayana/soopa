[project]
name = "as2_server"
version = "0.1.0"
description = "FastAPI HTTP Listener for incoming AS2 messages"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "ucp_models",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.22.0",
    "gunicorn>=22.0.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.0",
    "edi",
    "identity",
    "observability",
    "sqlalchemy>=2.0.0",
    "orchestrator-worker",
]

[tool.uv.sources]
ucp_models = { workspace = true }
edi = { workspace = true }
identity = { workspace = true }
observability = { workspace = true }
orchestrator-worker = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.deptry]
extend_exclude = ["scripts"]
known_first_party = ["as2_server"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "uvicorn",
    "gunicorn",
    "python-dotenv",
    "prometheus-client"
]

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../../../core/ucp/packages/models/src",
    "../../../../core/platform/packages/identity/src",
    "../../../../core/platform/packages/observability/python/src",
    "../../../../core/platform/packages/schemas/python/src",
    "../../packages/edi/src",
    "../edi-compute-worker/src",
    "../edi-orchestrator-worker/src",
    "src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
