[project]
name = "security"
version = "0.1.0"
description = "Enterprise Cryptography Library for PKCS7, S/MIME, and X509"
authors = [
    {name = "EDI Security Team", email = "security@edi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "asn1crypto>=1.5.1",
    "cryptography>=44.0.0",
    "pyopenssl>=26.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security"]

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../../../core/platform/packages/identity/python/src",
    "../../../../core/platform/packages/observability/python/src",
    "../../../../core/platform/packages/schemas/python/src",
    "../database/src",
    "../pipeline/src",
    "../grammar/src",
    "../config/src",
    "src",
    "../patches/src",
    "../transformer/src",
    "../as2_core/src",
    "../bots_core/src",
    "../domain/src",
    "../../apps/edi-worker/compute/src",
    "../../apps/edi-worker/ucp-sync/src",
    "../../apps/edi-worker/orchestrator/src",
    "../../apps/edi-as2-server/src",
    "../../apps/edi-api/src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
