[project]
name = "database"
version = "0.1.0"
description = "PostgreSQL schemas, models, and connection pooling for EDI AS2"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "ucp_models",
    "config",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "aioboto3>=13.0.0",
    "structlog>=26.1.0",
    "cryptography>=49.0.0",
]

[tool.alembic]
script_location = "src/database/migrations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/database"]

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../../../core/ucp/packages/models/src",
    "../../../../core/platform/packages/identity/src",
    "../observability/python/src",
    "../schemas/python/src",
    "src",
    "../../../../apps/edi/packages/pipeline/src",
    "../../../../apps/edi/packages/grammar/src",
    "../../../../apps/edi/packages/config/src",
    "../../../../apps/edi/packages/security/src",
    "../../../../apps/edi/packages/patches/src",
    "../../../../apps/edi/packages/transformer/src",
    "../../../../apps/edi/packages/as2_core/src",
    "../../../../apps/edi/packages/bots_core/src",
    "../../../../apps/edi/packages/domain/src",
    "../../../../apps/edi/apps/edi-worker/compute/src",
    "../../../../apps/edi/apps/edi-worker/ucp-sync/src",
    "../../../../apps/edi/apps/edi-worker/orchestrator/src",
    "../../../../apps/edi/apps/edi-as2-server/src",
    "../../../../apps/edi/packages/edi/src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"

[tool.uv.sources]
ucp_models = { workspace = true }
config = { workspace = true }
