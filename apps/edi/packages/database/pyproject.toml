[project]
name = "database"
version = "0.1.0"
description = "PostgreSQL schemas, models, and connection pooling for EDI AS2"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "aioboto3>=13.0.0",
]

[tool.alembic]
script_location = "src/database/migrations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/database"]
