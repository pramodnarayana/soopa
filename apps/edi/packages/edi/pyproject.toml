[project]
name = "edi"
version = "0.1.0"
description = "FastAPI Main Gateway for EDI Platform"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "gunicorn>=22.0.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aioboto3>=12.0.0",
    "database",
    "identity",
    "config",
    "observability",
    "security",
    "patches",
    "pipeline",
    "domain",
    "hvac>=2.4.0",
    "cryptography>=41.0.0",
    "httpx>=0.24.1",
    "paramiko>=3.3.1",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "anyio>=3.7.1",
    "as2-core",
    "transformer"
]

[tool.uv.sources]
database = { workspace = true }
identity = { workspace = true }
config = { workspace = true }
observability = { workspace = true }
security = { workspace = true }
patches = { workspace = true }
pipeline = { workspace = true }
domain = { workspace = true }
as2-core = { workspace = true }
transformer = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.deptry]
known_first_party = ["edi"]

[tool.deptry.package_module_name_map]
"python-dotenv" = ["dotenv"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "uvicorn",
    "gunicorn",
    "prometheus-client",
    "pydantic-settings",
    "observability"
]

[tool.ruff.lint.per-file-ignores]
"src/edi/main.py" = ["B008", "E402"]
"src/edi/cdc_relay.py" = ["B008"]
"src/edi/routers/**/*.py" = ["B008", "E402"]
"src/edi/dependencies/**/*.py" = ["B008"]
"tests/**/*.py" = ["E402"]

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../../../core/platform/packages/identity/python/src",
    "../../../../core/platform/packages/observability/python/src",
    "../../../../core/platform/packages/schemas/python/src",
    "../../packages/database/src",
    "../../packages/pipeline/src",
    "../../packages/grammar/src",
    "../../packages/config/src",
    "../../packages/security/src",
    "../../packages/patches/src",
    "../../packages/transformer/src",
    "../../packages/as2_core/src",
    "../../packages/bots_core/src",
    "../../packages/domain/src",
    "../edi-worker/compute/src",
    "../edi-worker/ucp-sync/src",
    "../edi-worker/orchestrator/src",
    "../edi-as2-server/src",
    "src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
