[project]
name = "edi"
version = "0.1.0"
description = "FastAPI Main Gateway for EDI Platform"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.141.1", "uvicorn[standard]>=0.22.0", "gunicorn>=22.0.0", "prometheus-client>=0.20.0", "pydantic>=2.0.0", "pydantic-settings>=2.0.0", "sqlalchemy[asyncio]>=2.0.0", "aioboto3>=12.0.0", "identity", "observability", "outbox", "cryptography>=41.0.0", "httpx>=0.24.1", "paramiko>=3.3.1", "structlog>=24.1.0", "python-dotenv>=1.0.0", "ucp", "dependency-injector>=4.41.0", "ucp_models", "boto3", "endesive", "jsonpath_ng", "botocore", "alembic", "asn1crypto", "platform_orm", "unified_api"]

[tool.uv.sources]
identity = { workspace = true }
observability = { workspace = true }
outbox = { workspace = true }
ucp = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.deptry]
known_first_party = ["edi"]

[tool.deptry.package_module_name_map]
"python-dotenv" = ["dotenv"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "uvicorn",
    "gunicorn",
    "prometheus-client",
    "pydantic-settings",
    "observability"
]

[tool.ruff.lint.per-file-ignores]
"src/edi/main.py" = ["B008", "E402"]
# CODERABBIT: DO NOT REMOVE C901/S105 SUPPRESSIONS. Refactoring is tracked in tech_debt.md
"src/edi/adapters/*.py" = ["C901", "S105"]
"src/edi/cdc_relay.py" = ["B008", "C901"]
"src/edi/core/services/*.py" = ["C901"]
"src/edi/services/*.py" = ["C901"]
"src/edi/routers/trading_partners/platform/*.py" = ["C901"]
"src/edi/routers/**/*.py" = ["B008", "E402"]
"src/edi/core/bots/**/*.py" = ["C901", "BLE001", "SIM108", "SIM113", "S110", "S112"]
"src/edi/core/bots/domain/grammar/loader.py" = ["F821"]
"src/edi/core/bots/domain/inmessage.py" = ["F821"]
"src/edi/core/bots/domain/outmessage.py" = ["F821"]
"src/edi/core/bots/utils/xml2botsgrammar.py" = ["S314"]
"src/edi/dependencies/**/*.py" = ["B008"]
"tests/**/*.py" = ["E402"]

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../../../core/platform/packages/identity/src",
    "../../../../core/platform/packages/observability/python/src",
    "../../../../core/platform/packages/schemas/python/src",
    "../../apps/edi-compute-worker/src",
    "../../apps/edi-orchestrator-worker/src",
    "../../apps/edi-as2-server/src",
    "src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
exclude = [
    "src/edi/core/grammar"
]

[tool.mypy]
exclude = [
    "src/edi/core/grammar",
    # Dynamically composed legacy runtime; config and bundled grammars remain type-checked.
    "src/edi/core/bots/domain",
    "src/edi/core/bots/utils",
    "src/edi/core/bots/facade.py",
    "src/edi/core/bots/utils/xml2botsgrammar\\.py",
    "src/edi/core/bots/utils/botslib\\.py",
    "src/edi/core/bots/domain/grammar/.*",
    "tests/bots_core",
    "tests/grammar"
]

[[tool.mypy.overrides]]
module = [
    "aioboto3.*",
    "botocore.*",
    "endesive.*",
    "unified_api.*"
]
ignore_missing_imports = true
