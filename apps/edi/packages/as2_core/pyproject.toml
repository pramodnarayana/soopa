[project]
name = "as2-core"
version = "0.1.0"
description = "Pure AS2 protocol logic, S/MIME, MDN generation"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
security = { workspace = true }

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../../../core/platform/packages/identity/python/src",
    "../../../../core/platform/packages/observability/python/src",
    "../../../../core/platform/packages/schemas/python/src",
    "../database/src",
    "../pipeline/src",
    "../grammar/src",
    "../config/src",
    "../security/src",
    "../patches/src",
    "../transformer/src",
    "src",
    "../bots_core/src",
    "../domain/src",
    "../../apps/edi-worker/compute/src",
    "../../apps/edi-worker/ucp-sync/src",
    "../../apps/edi-worker/orchestrator/src",
    "../../apps/edi-as2-server/src",
    "../../apps/edi-api/src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
