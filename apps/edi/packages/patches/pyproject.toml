[project]
name = "patches"
version = "0.1.0"
description = "Monkey-patches for third-party OSS libraries used by this platform"
authors = [
    {name = "EDI Platform Team", email = "team@edi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.4.0",
    "cryptography>=41.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
