[project]
name = "domain"
version = "0.1.0"
description = "Core domain models and events"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../../../core/platform/packages/identity/src",
    "../../../../core/platform/packages/observability/python/src",
    "../../../../core/platform/packages/schemas/python/src",
    "../database/src",
    "../pipeline/src",
    "../grammar/src",
    "../config/src",
    "../security/src",
    "../patches/src",
    "../transformer/src",
    "../as2_core/src",
    "../bots_core/src",
    "src",
    "../../apps/edi-worker/compute/src",
    "../../apps/edi-worker/ucp-sync/src",
    "../../apps/edi-worker/orchestrator/src",
    "../../apps/edi-as2-server/src",
    "../../apps/edi-api/src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
