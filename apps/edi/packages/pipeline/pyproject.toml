[project]
name = "pipeline"
version = "0.1.0"
description = "Core business logic for orchestrating EDI translation and delivery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "aioboto3>=13.1.1",
    "httpx>=0.27.0",
    "jsonpath-ng>=1.6.1",
    # Local dependencies
    "as2-core",
    "security",
    "bots-core",
    "transformer",
    "database",
    "identity",
    "paramiko>=5.0.0",
    "types-paramiko>=3.0.0",
    "patches",
    "domain",
]

[tool.uv.sources]
bots-core = { workspace = true }
transformer = { workspace = true }
database = { workspace = true }
identity = { workspace = true }
as2-core = { workspace = true }
security = { workspace = true }
patches = { workspace = true }
domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../../../core/platform/packages/identity/src",
    "../../../../core/platform/packages/observability/python/src",
    "../../../../core/platform/packages/schemas/python/src",
    "../database/src",
    "src",
    "../grammar/src",
    "../config/src",
    "../security/src",
    "../patches/src",
    "../transformer/src",
    "../as2_core/src",
    "../bots_core/src",
    "../domain/src",
    "../../apps/edi-worker/compute/src",
    "../../apps/edi-worker/ucp-sync/src",
    "../../apps/edi-worker/orchestrator/src",
    "../../apps/edi-as2-server/src",
    "../../apps/edi-api/src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
