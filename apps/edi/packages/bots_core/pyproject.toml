[project]
name = "bots-core"
version = "0.1.0"
description = "Vendored BOTS Open Source EDI Translator"
authors = [
    {name = "BOTS Open Source Team", email = "bots@example.com"},
    {name = "SoopaEDI Integration Team", email = "team@soopaedi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "lxml",
    "defusedxml>=0.7.1",
    "pdfminer.six",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bots_core"]

[tool.mypy]
strict = true
ignore_missing_imports = true

# The following modules are vendored legacy code from the BOTS Open Source EDI Translator.
# They pre-date Python typing and cannot be strictly type-checked without a full rewrite.
# They are excluded from strict mode while the application layer (facade, application) is typed.
[[tool.mypy.overrides]]
module = [
    "bots_core.domain.*",
    "bots_core.utils.*",
    "bots_core.infrastructure.config.*",
    "bots_core.usersys.*",
]
ignore_errors = true

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../../../core/platform/packages/identity/python/src",
    "../../../../core/platform/packages/observability/python/src",
    "../../../../core/platform/packages/schemas/python/src",
    "../database/src",
    "../pipeline/src",
    "../grammar/src",
    "../config/src",
    "../security/src",
    "../patches/src",
    "../transformer/src",
    "../as2_core/src",
    "src",
    "../domain/src",
    "../../apps/edi-worker/compute/src",
    "../../apps/edi-worker/ucp-sync/src",
    "../../apps/edi-worker/orchestrator/src",
    "../../apps/edi-as2-server/src",
    "../../apps/edi-api/src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
