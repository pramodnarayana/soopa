[project]
name = "ip"
version = "0.1.0"
description = "Enterprise Integration Platform (iPaaS) for Soopa"
authors = [
    {name = "Soopa Integration Platform Team", email = "team@soopa.com"}
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "httpx>=0.27.0",
    "cryptography>=44.0.0",
    "structlog>=24.1.0",
    "asyncpg>=0.29.0",
    "paramiko>=3.3.1",
    "seedwork",
    "database",
    "observability",
    "security",
    "outbox",
    "pubsub",
    "shttp",
    "sftp",
    "pyyaml>=6.0.2",
]

[tool.uv.sources]
seedwork = { workspace = true }
database = { workspace = true }
observability = { workspace = true }
security = { workspace = true }
outbox = { workspace = true }
pubsub = { workspace = true }
shttp = { workspace = true }
sftp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-httpserver>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --import-mode=importlib"
markers = [
    "integration: narrow integration tests against live PostgreSQL, S3, SFTP, and HTTP",
    "e2e: end-to-end multi-stage pipeline tests",
]

[tool.coverage.run]
source = ["ip"]
omit = [
    "*/migrations/*",
    "*/run_migrations.py",
    "*/bootstrap/*",
]

[tool.coverage.report]
show_missing = true
