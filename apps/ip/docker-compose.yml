services:
  ip_postgres_shard:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ip
      POSTGRES_PASSWORD: ip_password
      POSTGRES_DB: ip_shard
    command:
      - postgres
      - -c
      - wal_level=logical
    ports:
      - "5434:5432"
    volumes:
      - ip_postgres_shard_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ip -d ip_shard
      interval: 5s
      timeout: 5s
      retries: 5

  ip_kafka:
    image: apache/kafka:3.9.0
    container_name: ip_kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    volumes:
      - ip_kafka_data:/tmp/kraft-combined-logs

volumes:
  ip_postgres_shard_data: null
  ip_kafka_data: null
