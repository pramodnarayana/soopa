rules:
  - id: ban-raw-postgres-url
    patterns:
      - pattern-regex: "postgresql(\\+[a-z0-9_]+)?://[^\"']*"
    message: |
      Enterprise Rule: Do not hardcode raw postgresql URLs or use them in string manipulations.
      Use properly typed configuration (e.g. Settings.async_database_url) instead.
    severity: ERROR
    languages:
      - python
    paths:
      exclude:
        - "**/migrations/**"
    metadata:
      test-cases:
        positive:
          - "conn = create_engine('postgresql://user:pass@localhost/db')"
          - "url = 'postgresql://localhost:5432/mydb'"
          - "conn = create_engine('postgresql+asyncpg://user:pass@localhost/db')"
        negative:
          - "url = settings.database_url"
          - "conn_str = 'redis://localhost:6379'"

  - id: ban-create-all-in-tests
    patterns:
      - pattern: $X.metadata.create_all(...)
    message: |
      Enterprise Rule: Never use create_all() in tests. Database schema must strictly
      originate from Alembic migrations (pnpm db:migrate) to avoid race conditions and
      hiding missing migrations.
    severity: ERROR
    languages:
      - python
    paths:
      include:
        - "**/tests/**"
