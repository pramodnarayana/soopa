rules:
  - id: ban-raw-postgres-url
    patterns:
      - pattern-regex: "postgresql(\\+[a-z0-9_]+)?://[^\"']*"
    message: |
      Enterprise Rule: Do not hardcode raw postgresql URLs or use them in string manipulations.
      Use properly typed configuration (e.g. Settings.async_database_url) instead.
    severity: ERROR
    languages:
      - python
    paths:
      exclude:
        - "**/migrations/**"
    metadata:
      test-cases:
        positive:
          - "conn = create_engine('postgresql://user:pass@localhost/db')"
          - "url = 'postgresql://localhost:5432/mydb'"
          - "conn = create_engine('postgresql+asyncpg://user:pass@localhost/db')"
        negative:
          - "url = settings.database_url"
          - "conn_str = 'redis://localhost:6379'"

  - id: ban-create-all-in-tests
    patterns:
      - pattern: $X.metadata.create_all(...)
    message: |
      Enterprise Rule: Never use create_all() in tests. Database schema must strictly
      originate from Alembic migrations (pnpm db:migrate) to avoid race conditions and
      hiding missing migrations.
    severity: ERROR
    languages:
      - python
    paths:
      include:
        - "**/tests/**"

  - id: ban-ip-solutions-in-ip-engine
    patterns:
      - pattern-either:
          - pattern: import ip.solutions.$ANY
          - pattern: from ip.solutions import $ANY
          - pattern: from ip.solutions.$MOD import $ANY
    message: |
      Enterprise Rule: Hexagonal Domain Purity. Generic platform engine modules (`ip.engine`)
      must never import vertical domain solutions (`ip.solutions`). Inject vertical plugins
      from the outer composition root (`ip.solutions.bootstrap` / `ip.module`).
    severity: ERROR
    languages:
      - python
    paths:
      include:
        - "apps/ip/packages/ip/src/ip/engine/**/*.py"

  - id: ban-conjoined-and-tests-in-ip
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  def $FUNC(...):
                    ...
              - pattern: |
                  async def $FUNC(...):
                    ...
          - metavariable-regex:
              metavariable: $FUNC
              regex: "^test_.*_and_.*$"
      - patterns:
          - pattern: |
              class $CLS:
                ...
          - metavariable-regex:
              metavariable: $CLS
              regex: "^Test.*[a-z0-9]And[A-Z].*$"
    message: |
      Enterprise Rule: Single Responsibility Principle (SRP) in Tests. Split conjoined
      `test_*_and_*` functions into atomic, single-behavior test cases so failures pinpoint
      exact regressions.
    severity: ERROR
    languages:
      - python
    paths:
      include:
        - "apps/ip/packages/ip/tests/**/*.py"

  - id: ban-conjoined-and-tests-in-ip-ui
    patterns:
      - pattern-either:
          - pattern: describe($TITLE, ...)
          - pattern: it($TITLE, ...)
          - pattern: test($TITLE, ...)
      - metavariable-regex:
          metavariable: $TITLE
          regex: "(?i).*(\\band\\b|&).*"
    message: |
      Enterprise Rule: Single Responsibility Principle (SRP) in UI Tests. Split conjoined
      Vitest `describe`/`it`/`test` blocks containing `and` or `&` into focused single-concept
      test cases.
    severity: ERROR
    languages:
      - typescript
    paths:
      include:
        - "apps/ip/packages/ui/src/__tests__/**/*.ts"
        - "apps/ip/packages/ui/src/__tests__/**/*.tsx"

  - id: ban-row-dict-loops-in-intervals
    patterns:
      - pattern-either:
          - pattern: $DF.iter_rows(...)
          - pattern: $DF.to_dicts(...)
          - pattern: $CLIENT.executemany(...)
    message: |
      Enterprise Rule (Columnar Interval Invariant 1): Never materialize row-level Python dict loops
      (`.iter_rows()`, `.to_dicts()`, `executemany()`) in the interval streams data plane.
      Always stream contiguous Apache Arrow IPC buffers (`insert_arrow_batch`).
    severity: ERROR
    languages:
      - python
    paths:
      include:
        - "apps/ip/packages/ip/src/ip/engine/adapters/outbound/intervals/**/*.py"
