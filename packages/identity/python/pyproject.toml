[project]
name = "soopa-identity"
version = "0.1.0"
description = "Soopa identity contracts, authorization, and middleware for Python services."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.10.0",
    "pydantic>=2.10.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
