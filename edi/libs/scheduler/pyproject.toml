[project]
name = "scheduler"
version = "0.1.0"
description = "Generic scheduler module for background tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "SQLAlchemy>=2.0.0",
    # Local dependencies
    "database",
    "croniter>=6.2.4",
]

[tool.uv.sources]
database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
