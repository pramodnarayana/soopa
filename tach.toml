exact = false
forbid_circular_dependencies = true
ignore_type_checking_imports = true
root_module = "forbid"
source_roots = [
    "core/ucp/packages/ucp/src",
    "apps/edi/packages/edi/src",
    "apps/edi/packages/transformer/src",
    "apps/edi/packages/pipeline/src",
    "core/platform/packages/identity/src",
    "core/platform/packages/schemas/python/src",
    "core/ucp/packages/models/src",
    "core/platform/apps/scheduler_engine/src",
    "core/platform/apps/unified-api/src"
]

[[modules]]
path = "edi.domain"
depends_on = []

[[modules]]
path = "edi.adapters"
depends_on = [
    "edi.domain",
    "edi.ports",
    "schemas"
]

[[modules]]
path = "ucp.domain"
depends_on = []

[[modules]]
path = "ucp.application"
depends_on = [
    "ucp.domain",
    "ucp.ports",
    "identity",
    "platform_orm.models",
    "schemas"
]

[[modules]]
path = "edi.bootstrap"
depends_on = [
    "edi.adapters",
    "edi.services"
]

[[modules]]
path = "ucp.bootstrap"
depends_on = [
    "ucp.adapters",
    "ucp.application"
]
