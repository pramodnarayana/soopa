[project]
name = "bots-core"
version = "0.1.0"
description = "Vendored BOTS Open Source EDI Translator"
authors = [
    {name = "BOTS Open Source Team", email = "bots@example.com"},
    {name = "SoopaEDI Integration Team", email = "team@soopaedi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "lxml",
    "defusedxml>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bots_core"]
