services:
  zitadel-postgres:
    image: postgres:16-alpine
    container_name: zitadel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: zitadel
      POSTGRES_DB: zitadel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U zitadel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - zitadel_data:/var/lib/postgresql/data:rw

  zitadel:
    image: ghcr.io/zitadel/zitadel:v3.4.12
    container_name: zitadel-server
    restart: unless-stopped
    command: start-from-init --masterkey "a-32-byte-long-secret-key-change" --tlsMode disabled
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: false
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_MACHINEKEY: "a-32-byte-long-secret-key-change"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: setupmachine
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: Password1!
    ports:
      - "8080:8080"
    depends_on:
      zitadel-postgres:
        condition: service_healthy

volumes:
  zitadel_data:
    driver: local
