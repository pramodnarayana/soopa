[project]
name = "edi"
version = "0.1.0"
description = "EDI AS2 Integration Platform"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "libs/*",
    "services/*"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "libs/as2_core/tests",
    "services/as2_server/tests",
]
pythonpath = [
    "libs/as2_core/src",
    "libs/database/src",
    "libs/config/src",
    "libs/identity/src",
    "libs/observability/src",
    "services/as2_server/src",
]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests requiring provisioned database (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "migrations"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".mypy_cache", ".ruff_cache", "venv", ".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"] # Handled by formatter

[tool.ruff.lint.per-file-ignores]
# FastAPI dependencies use default arguments
"services/api/src/api/main.py" = ["B008"]
"services/as2_server/src/as2_server/main.py" = ["B008"]
"libs/identity/src/identity/dependencies.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["libs", "services"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
