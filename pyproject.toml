[project]
name = "edi"
version = "0.1.0"
description = "EDI AS2 Integration Platform"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "libs/*",
    "services/*"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = ["node_modules", "frontend"]

pythonpath = [
    "libs/as2_core/src",
    "libs/bots_core/src",
    "libs/database/src",
    "libs/config/src",
    "libs/identity/src",
    "libs/observability/src",
    "services/as2_server/src",
]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests requiring provisioned database (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "migrations", "tests", ".*/tests/.*", "libs/bots_core/src/bots_core"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".mypy_cache", ".ruff_cache", "venv", ".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"] # Handled by formatter

[tool.ruff.lint.per-file-ignores]
# FastAPI dependencies use default arguments
"services/api/src/api/main.py" = ["B008"]
"services/api/src/api/cdc_relay.py" = ["B008"]
"services/api/src/api/routers/partners.py" = ["B008"]
"services/as2_server/src/as2_server/main.py" = ["B008"]
"libs/identity/src/identity/dependencies.py" = ["B008"]
# Legacy BOTS engine formatting ignores
"libs/bots_core/src/bots_core/domain/*" = ["UP031", "SIM113", "E402", "SIM108", "SIM102", "F841", "F821", "UP038"]
"libs/bots_core/src/bots_core/utils/*" = ["UP031", "SIM113", "SIM102", "E402", "F821", "F841", "UP038"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["libs", "services"]
omit = [
    "*/tests/*",
    "*/migrations/*"
]

[tool.coverage.report]
# TODO: Increase fail_under to 80 once remaining legacy formats are either pruned or tested
show_missing = true
fail_under = 38
