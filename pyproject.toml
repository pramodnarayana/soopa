[project]
name = "soopa-monorepo"
version = "0.1.0"
description = "EDI AS2 Integration Platform"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=49.0.0",
    "endesive>=2.19.3",
    "jsonpath-ng>=1.8.0",
]

[tool.uv]
override-dependencies = ["pykcs11"]

[tool.uv.workspace]
members = [
    "core/platform/packages/*/python",
    "core/platform/packages/identity",
    "core/platform/packages/orm",
    "core/platform/packages/observability",
    "core/platform/packages/outbox",
    "core/platform/packages/pubsub",
    "core/ucp/packages/models",
    "core/ucp/packages/ucp",
    "core/platform/packages/schemas/python",
    "core/ucp/apps/ucp-worker",
    "apps/edi/packages/edi",
    "apps/edi/apps/edi-as2-server",
    "apps/edi/apps/edi-compute-worker",
    "apps/edi/apps/edi-config-sync-worker",
    "apps/edi/apps/edi-orchestrator-worker",
    "apps/edi/apps/edi-background-worker",
    "apps/edi/apps/edi-secrets-sidecar",
    "core/platform/apps/scheduler-worker",
    "core/platform/packages/scheduler",
    "core/platform/packages/notification",
    "core/platform/apps/notification-worker",
    "core/platform/apps/identity-worker",
    "core/platform/apps/unified-api",
    "apps/edi/apps/edi-secrets-sidecar",
]
exclude = ["apps/edi/packages/ui"]

[tool.uv.sources]
identity = { workspace = true }
platform-orm = { workspace = true }
platform-schemas = { workspace = true }
observability = { workspace = true }
outbox = { workspace = true }
pubsub = { workspace = true }
notification = { workspace = true }
scheduler = { workspace = true }
ucp = { workspace = true }
ucp-models = { workspace = true }
edi = { workspace = true }
as2-server = { workspace = true }
unified-api = { workspace = true }
pykcs11 = { path = "tools/dummy-pykcs11" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = ["node_modules", "frontend"]


addopts = "-v --tb=short --ignore=services/worker"
markers = [
    "integration: marks tests as integration tests requiring provisioned database (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "testcontainers[postgres]>=4.15.0",
    "pytest-archon>=0.0.6",
    "tach>=0.14.0",
    "vulture>=2.16",
    "deptry>=0.25.1",
    "pip-audit>=2.10.1",
    "types-paramiko>=3.3.0",
]

[tool.mypy]
strict = true
warn_unused_ignores = false
exclude = [
    "venv",
    ".venv",
    "migrations",
    "tests",
    ".*/tests/.*",
    # Dynamically composed legacy Bots runtime; other Bots modules remain type-checked.
    "^apps/edi/packages/edi/src/edi/core/bots/domain(/|$)",
    "^apps/edi/packages/edi/src/edi/core/bots/utils(/|$)",
    "^apps/edi/packages/edi/src/edi/core/bots/facade\\.py$",
    ".*grammar.*",
    "services/worker",
    "^(.*/)?scripts/.*$",
    # Standalone entrypoint script — not a package; excluded to avoid duplicate module 'main' conflict.
    "^apps/edi/apps/edi-secrets-sidecar/main\\.py$",
]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
namespace_packages = true
mypy_path = [
    "core/platform/packages/identity/src",
    "core/platform/packages/observability/src",
    "core/platform/packages/schemas/python/src",
    "core/platform/packages/orm/src",
    "core/platform/packages/notification/src",
    "core/platform/apps/scheduler-worker/src",
    "core/platform/packages/scheduler/src",
    "core/platform/apps/unified-api/src",
    "core/ucp/packages/ucp/src",
    "core/ucp/packages/models/src",
    "apps/edi/packages/edi/src",
    "apps/edi/apps/edi-compute-worker/src",
    "apps/edi/apps/edi-orchestrator-worker/src",
    "apps/edi/apps/edi-as2-server/src",
    "apps/edi/apps/edi-background-worker/src",
    "apps/edi/apps/edi-config-sync-worker/src",
    "core/platform/packages/outbox/src",
    "core/platform/packages/pubsub/src",
    "core/platform/apps/identity-worker/src",
    "core/platform/apps/notification-worker/src",
    "core/ucp/apps/ucp-worker/src",
]

[[tool.mypy.overrides]]
module = [
    "hvac.*",
    "aioboto3.*",
    "asyncpg.*",
    "sse_starlette.*",
    "opentelemetry.*",
    "prometheus_client.*",
    "croniter.*",
    "paramiko.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "bots_core.*",
]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".mypy_cache", ".ruff_cache", "venv", ".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "G", "BLE", "TRY", "PIE", "RUF", "S", "C90", "TID251"]
ignore = ["E501", "B904", "E402", "TRY003", "RUF013", "TRY300", "TRY301", "RUF012", "S101"] # Handled by formatter / existing legacy code

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use structlog via ILogger port instead of standard logging."

[tool.ruff.lint.per-file-ignores]
# FastAPI dependencies use default arguments
"apps/edi/packages/edi/src/api/main.py" = ["B008", "E402"]
"apps/edi/packages/edi/src/api/cdc_relay.py" = ["B008", "C901"]
"apps/edi/packages/edi/src/api/routers/**/*.py" = ["B008", "C901"]
"apps/edi/packages/edi/src/edi/routers/**/*.py" = ["B008", "C901"]
"apps/edi/packages/edi/src/api/dependencies/**/*.py" = ["B008"]
"apps/edi/apps/edi-as2-server/src/as2_server/main.py" = ["B008"]
"apps/edi/legacy_libs/identity/src/identity/dependencies.py" = ["B008"]
"core/platform/packages/identity/src/identity/**/*.py" = ["B008"]
"core/ucp/packages/ucp/src/**/*.py" = ["B008", "E402"]
"core/platform/apps/unified-api/src/**/*.py" = ["B008"]
"apps/edi/packages/edi/tests/**/*.py" = ["E402"]

"apps/edi/apps/edi-as2-server/tests/conftest.py" = ["S603", "S607"]
# Legacy BOTS engine formatting ignores
"apps/edi/packages/edi/src/edi/core/bots/domain/*" = ["UP031", "SIM113", "E402", "SIM108", "SIM105", "SIM102", "F841", "UP038", "F405", "F401", "BLE", "TRY", "C901", "S112"]
"apps/edi/packages/edi/src/edi/core/bots/domain/parsers/*" = ["UP031", "SIM113", "E402", "SIM108", "SIM105", "SIM102", "F841", "UP038", "F405", "F401", "BLE", "TRY", "C901", "S112"]
"apps/edi/packages/edi/src/edi/core/bots/utils/*" = ["UP031", "SIM113", "E402", "SIM108", "SIM105", "SIM102", "F841", "UP038", "F405", "F401", "BLE", "TRY", "C901", "S112"]
"apps/edi/packages/edi/src/edi/core/bots/facade.py" = ["UP031", "SIM113", "E402", "SIM108", "SIM105", "SIM102", "F841", "UP038", "F405", "F401", "BLE", "TRY", "C901", "S112"]
"apps/edi/packages/edi/src/edi/core/grammar/**/*.py" = ["F401", "F403", "F405", "F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["apps", "core"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    # Infrastructure adapters requiring live external connections (DB, SFTP, Vault).
    # These are covered by integration tests, not unit tests — per hexagonal arch conventions.
    "apps/edi/packages/edi/src/api/adapters/edi_header_repository.py",
    "apps/edi/packages/edi/src/api/adapters/outbound_route_repository.py",
    "apps/edi/packages/edi/src/api/adapters/as2_partnership_repository.py",
    "apps/edi/packages/edi/src/api/adapters/transaction_repository.py",
    "apps/edi/packages/edi/src/api/adapters/api_token_repository.py",
    "apps/edi/packages/edi/src/api/adapters/webhook_repository.py",
    "apps/edi/packages/edi/src/api/adapters/outbox_repository.py",
    "apps/edi/packages/edi/src/api/adapters/as2_partner_repository.py",
    "apps/edi/packages/edi/src/api/adapters/tenant_repository.py",
    "apps/edi/packages/edi/src/api/adapters/sftp_repository.py",
    "apps/edi/packages/edi/src/api/adapters/data_plane_as2_repository.py",
    "apps/edi/packages/edi/src/api/adapters/inbound_route_repository.py",
    "*/adapters/sftp.py",
    "*/adapters/paramiko_sftp_tester.py",
    "*/adapters/vault.py",
    "*/adapters/sqs_queue.py",
    # AS2 server main (ASGI lifespan wiring — integration only)
    "apps/edi/apps/edi-as2-server/src/as2_server/main.py",
    # Transformer worker entrypoint (subprocess runner, not business logic)
    "apps/edi/apps/edi-compute-worker/src/compute_worker/worker.py",
    "apps/edi/apps/edi-compute-worker/src/compute_worker/main.py",
]

[tool.coverage.report]
# Required 80% coverage
show_missing = true
fail_under = 80

[tool.pyright]
ignore = ["apps/edi/packages/edi/src/edi/core/grammar", "**/migrations"]
venvPath = "."
venv = ".venv"
extraPaths = [
    "core/platform/packages/identity/src",
    "core/platform/packages/identity/python/src",
    "core/platform/packages/observability/src",
    "core/platform/packages/observability/python/src",
    "core/platform/packages/schemas/python/src",
    "core/platform/packages/schemas/src",
    "core/platform/packages/orm/src",
    "core/platform/packages/notification/src",
    "core/platform/packages/scheduler/src",
    "core/platform/packages/outbox/src",
    "core/platform/packages/pubsub/src",
    "core/platform/apps/scheduler-worker/src",
    "core/platform/apps/notification-worker/src",
    "core/platform/apps/identity-worker/src",
    "core/platform/apps/unified-api/src",
    "core/ucp/packages/ucp/src",
    "core/ucp/packages/models/src",
    "core/ucp/apps/ucp-worker/src",
    "apps/edi/packages/edi/src",
    "apps/edi/apps/edi-compute-worker/src",
    "apps/edi/apps/edi-orchestrator-worker/src",
    "apps/edi/apps/edi-as2-server/src",
    "apps/edi/apps/edi-background-worker/src",
    "apps/edi/apps/edi-config-sync-worker/src",
]

[tool.vulture]
exclude = ["venv", ".venv", "migrations", "tests", "*bots_core*", "*grammar*", "legacy_libs", ".git", "node_modules"]
paths = ["apps", "core"]
ignore_names = ["cls", "kwargs", "args", "QueueName", "MaxNumberOfMessages", "QueueUrl", "WaitTimeSeconds", "ReceiptHandle", "MessageBody", "MessageGroupId", "MessageDeduplicationId", "Entries", "connection", "routedict", "ta_fromfile", "dialect", "memo"]
min_confidence = 80

[tool.deptry]
known_first_party = [
    "config_sync_worker",
    "scheduler_worker",
    "orchestrator_worker",
    "compute_worker",
    "identity_worker",
    "ucp_worker",
    "notification_worker",
    "api",
    "ucp",
    "edi",
    "identity",
    "observability",
    "scheduler",
    "orm",
    "as2_server",
    "notification",
    "outbox",
    "pubsub",
]
