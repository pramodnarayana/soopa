[project]
name = "edi"
version = "0.1.0"
description = "EDI AS2 Integration Platform"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=49.0.0",
    "endesive>=2.19.3",
    "jsonpath-ng>=1.8.0",
]

[tool.uv.workspace]
members = [
    "core/platform/packages/*/python",
    "core/platform/packages/orm",
    "core/ucp/packages/models",
    "core/ucp/apps/ucp-api",
    "core/platform/packages/schemas/python",
    "apps/edi/apps/edi-api",
    "apps/edi/apps/edi-as2-server",
    "apps/edi/apps/edi-worker/*",
    "apps/edi/packages/*",
    "core/platform/apps/scheduler_engine",
    "core/platform/apps/notification_engine",
]
exclude = ["apps/edi/packages/ui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = ["node_modules", "frontend"]

pythonpath = [
    "core/platform/packages/identity/python/src",
    "core/platform/packages/observability/python/src",
    "apps/edi/packages/as2_core/src",
    "apps/edi/packages/bots_core/src",
    "apps/edi/packages/config/src",
    "apps/edi/packages/database/src",
    "apps/edi/packages/domain/src",
    "apps/edi/packages/grammar/src",
    "apps/edi/packages/identity/src",
    "apps/edi/packages/patches/src",
    "apps/edi/packages/pipeline/src",
    "apps/edi/packages/security/src",
    "apps/edi/packages/transformer/src",
    "apps/edi/apps/edi-api/src",
    "apps/edi/apps/edi-as2-server/src",
    "apps/edi/apps/edi-worker/orchestrator/src",
    "apps/edi/apps/edi-worker/compute/src",
]
addopts = "-v --tb=short --ignore=services/worker --ignore=apps/edi/packages/transformer/tests/test_worker.py --ignore=apps/edi/packages/transformer/scripts"
markers = [
    "integration: marks tests as integration tests requiring provisioned database (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "migrations", "tests", ".*/tests/.*", "apps/edi/packages/bots_core/src/bots_core", "apps/edi/packages/grammar", "services/worker"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "hvac.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".mypy_cache", ".ruff_cache", "venv", ".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"] # Handled by formatter

[tool.ruff.lint.per-file-ignores]
# FastAPI dependencies use default arguments
"apps/edi/apps/edi-api/src/api/main.py" = ["B008", "E402"]
"apps/edi/apps/edi-api/src/api/cdc_relay.py" = ["B008"]
"apps/edi/apps/edi-api/src/api/routers/**/*.py" = ["B008"]
"apps/edi/apps/edi-api/src/api/dependencies.py" = ["B008"]
"apps/edi/apps/edi-as2-server/src/as2_server/main.py" = ["B008"]
"apps/edi/legacy_libs/identity/src/identity/dependencies.py" = ["B008"]
"core/platform/packages/identity/python/identity/**/*.py" = ["B008"]
"apps/edi/apps/edi-api/tests/**/*.py" = ["E402"]
# Legacy BOTS engine formatting ignores
"apps/edi/packages/bots_core/src/bots_core/domain/*" = ["UP031", "SIM113", "E402", "SIM108", "SIM102", "F841", "F821", "UP038", "F405"]
"apps/edi/packages/bots_core/src/bots_core/utils/*" = ["UP031", "SIM113", "SIM102", "E402", "F821", "F841", "UP038", "F405"]
"apps/edi/packages/grammar/**/*.py" = ["F401", "F403", "F405", "F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["apps", "core"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    # Infrastructure adapters requiring live external connections (DB, SFTP, Vault).
    # These are covered by integration tests, not unit tests — per hexagonal arch conventions.
    "apps/edi/apps/edi-api/src/api/adapters/edi_header_repository.py",
    "apps/edi/apps/edi-api/src/api/adapters/outbound_route_repository.py",
    "apps/edi/apps/edi-api/src/api/adapters/as2_partnership_repository.py",
    "apps/edi/apps/edi-api/src/api/adapters/transaction_repository.py",
    "apps/edi/apps/edi-api/src/api/adapters/api_token_repository.py",
    "apps/edi/apps/edi-api/src/api/adapters/webhook_repository.py",
    "apps/edi/apps/edi-api/src/api/adapters/outbox_repository.py",
    "apps/edi/apps/edi-api/src/api/adapters/as2_partner_repository.py",
    "apps/edi/apps/edi-api/src/api/adapters/tenant_repository.py",
    "apps/edi/apps/edi-api/src/api/adapters/sftp_repository.py",
    "apps/edi/apps/edi-api/src/api/adapters/data_plane_as2_repository.py",
    "apps/edi/apps/edi-api/src/api/adapters/inbound_route_repository.py",
    "*/adapters/sftp.py",
    "*/adapters/paramiko_sftp_tester.py",
    "*/adapters/vault.py",
    "*/adapters/sqs_queue.py",
    # AS2 server main (ASGI lifespan wiring — integration only)
    "apps/edi/apps/edi-as2-server/src/as2_server/main.py",
    # Transformer worker entrypoint (subprocess runner, not business logic)
    "apps/edi/apps/edi-worker/compute/src/compute_worker/worker.py",
    "apps/edi/apps/edi-worker/compute/src/compute_worker/main.py",
]

[tool.coverage.report]
# Required 80% coverage
show_missing = true
fail_under = 80

[tool.pyright]
ignore = ["apps/edi/packages/grammar", "**/migrations"]
venvPath = "."
venv = ".venv"
extraPaths = [
    "core/platform/packages/identity/python/src",
    "core/platform/packages/observability/python/src",
    "core/platform/packages/schemas/python/src",
    "apps/edi/packages/database/src",
    "apps/edi/packages/pipeline/src",
    "apps/edi/packages/grammar/src",
    "apps/edi/packages/config/src",
    "apps/edi/packages/security/src",
    "apps/edi/packages/patches/src",
    "apps/edi/packages/transformer/src",
    "apps/edi/packages/as2_core/src",
    "apps/edi/packages/bots_core/src",
    "apps/edi/packages/domain/src",
    "apps/edi/apps/edi-worker/compute/src",
    "apps/edi/apps/edi-worker/ucp-sync/src",
    "apps/edi/apps/edi-worker/orchestrator/src",
    "apps/edi/apps/edi-as2-server/src",
    "apps/edi/apps/edi-api/src",
]
