version: '3.8'

services:
  openas2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REGISTRY_URL: ${OPENAS2_REGISTRY_URL:-openas2-openas2}
        OPENAS2_VERSION: ${OPENAS2_VERSION:-latest}
    container_name: openas2_testing_partner
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "10080:10080"
    volumes:
      - ./data/outbox:/opt/openas2/data/outbox
    restart: unless-stopped
    networks:
      soopa_mono_default:
        aliases:
          - openas2
          - openas2_testing_partner

networks:
  soopa_mono_default:
    name: soopa_mono_default
    external: true
