version: '3.8'

services:
  openas2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openas2_testing_partner
    ports:
      - "10080:10080"
    environment:
      - SOOPA_AS2_URL=http://host.docker.internal:3000/api/v1/as2/receive
    volumes:
      - ./data/outbox:/opt/openas2/data/outbox
    restart: unless-stopped
