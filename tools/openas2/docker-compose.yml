version: '3.8'

services:
  openas2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENAS2_VERSION: ${OPENAS2_VERSION:-3.3.0}
    container_name: openas2_testing_partner
    ports:
      - "10080:10080"
    volumes:
      - ./data/outbox:/opt/openas2/data/outbox
    restart: unless-stopped
