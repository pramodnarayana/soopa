config:
  aws:region: us-east-1

  # ── Shared Foundation Layer ────────────────────────────────────────────────
  foundation:enable_interface_endpoints: "true"

  # ── Shared Data Layer ──────────────────────────────────────────────────────
  data:db_instance_class: "db.t4g.medium"
  data:multi_az: "false"
  data:skip_final_snapshot: "false"
  data:secret_recovery_window_days: "30"

  # ── Shared Platform Layer ──────────────────────────────────────────────────
  platform:image_tag: latest
  platform:root_domain: flowwolf.io
  platform:staging_domain: flowwolf.io
  platform:log_retention_days: "90"
  platform:ecr_max_image_count: "30"
  platform:enable_observability: "true"
  platform:secret_recovery_window_days: "30"

  # ── Shared Operations Layer ────────────────────────────────────────────────
  ops:use_spot: "false"

  # ── Shared Observability Layer ─────────────────────────────────────────────
  organization-openobserve:enable: "true"
  organization-openobserve:log_retention_days: "90"
  organization-openobserve:secret_recovery_window_days: "30"

  # ── Identity Layer ─────────────────────────────────────────────────────────
  zitadel:secret_recovery_window_days: "30"

  # ── EDI Application ────────────────────────────────────────────────────────
  edi-storage:noncurrent_version_retention_days: "30"
  edi-workers:edi_environment: "P"
  edi-workers:enable_observability: "true"
  edi-workers:image_tag: latest
  edi-workers:enable_autoscaling: "true"
  edi-workers:min_capacity: "1"
  edi-workers:max_capacity: "4"
  edi-workers:target_cpu_percent: "75"
  edi-workers:target_memory_percent: "75"
  edi-as2:edi_environment: "P"
  edi-as2:enable_observability: "true"
  edi-as2:image_tag: latest
  edi-as2:enable_autoscaling: "true"
  edi-as2:min_capacity: "1"
  edi-as2:max_capacity: "4"
  edi-as2:target_cpu_percent: "70"
  edi-as2:target_memory_percent: "75"

  # ── Unified Commerce Platform (UCP) Application ────────────────────────────
  ucp-workers:enable_observability: "true"
  ucp-workers:edi_environment: "P"
  ucp-workers:secret_recovery_window_days: "30"
  ucp-workers:enable_autoscaling: "true"
  ucp-workers:min_capacity: "1"
  ucp-workers:max_capacity: "4"
  ucp-workers:target_cpu_percent: "75"
  ucp-workers:target_memory_percent: "75"

  # ── Unified API Application ────────────────────────────────────────────────
  api:enable_observability: "true"
  api:edi_environment: "P"
  api:enable_autoscaling: "true"
  api:min_capacity: "1"
  api:max_capacity: "4"
  api:target_cpu_percent: "70"
  api:target_memory_percent: "75"
