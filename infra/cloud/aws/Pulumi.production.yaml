config:
  aws:region: us-east-1
  # Credentials are provided via AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
  # environment variables injected by CI/CD — never committed here.
  #
  # ── Compute layer config ───────────────────────────────────────────────────
  # image_tag: overridden by CI to the git SHA of the build being deployed.
  edi-platform:image_tag: latest
  # acm_certificate_arn: ACM cert ARN for the AS2 server ALB HTTPS listener.
  # Replace with your actual production cert ARN before deploying.
  edi-platform:acm_certificate_arn: arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/PROD_CERT_ID
  # Replica counts — production runs HA footprint.
  edi-platform:as2_server_replicas: "2"
  edi-platform:compute_worker_replicas: "2"
  edi-platform:dlq_max_receive_count: "5"
  edi-platform:log_retention_days: "90"
  edi-platform:kms_key_arn: arn:aws:kms:us-east-1:ACCOUNT_ID:key/PROD_KMS_KEY_ID
  # Compute and memory sizing
  edi-platform:as2_server_cpu: "1024"
  edi-platform:as2_server_memory: "2048"
  edi-platform:as2_server_workers: "4"
  edi-platform:background_worker_cpu: "512"
  edi-platform:background_worker_memory: "1024"
  edi-platform:compute_worker_cpu: "2048"
  edi-platform:compute_worker_memory: "4096"
  edi-platform:orchestrator_worker_cpu: "512"
  edi-platform:orchestrator_worker_memory: "1024"
  edi-platform:config_sync_worker_cpu: "256"
  edi-platform:config_sync_worker_memory: "512"
