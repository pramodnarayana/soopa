config:
  aws:region: us-east-1

  # ── Shared Foundation Layer ────────────────────────────────────────────────
  foundation:enable_interface_endpoints: "false"

  # ── Shared Data Layer ──────────────────────────────────────────────────────
  data:db_instance_class: "db.t4g.micro"
  data:multi_az: "false"
  data:skip_final_snapshot: "true"
  data:secret_recovery_window_days: "0"

  # ── Shared Platform Layer ──────────────────────────────────────────────────
  platform:image_tag: latest
  platform:root_domain: flowwolf.io
  platform:staging_domain: staging.flowwolf.io
  platform:log_retention_days: "3"
  platform:ecr_max_image_count: "10"
  platform:enable_observability: "true"
  platform:secret_recovery_window_days: "0"

  # ── Shared Operations Layer ────────────────────────────────────────────────
  ops:use_spot: "true"

  # ── Shared Observability Layer ─────────────────────────────────────────────
  organization-openobserve:enable: "true"
  organization-openobserve:log_retention_days: "3"
  organization-openobserve:secret_recovery_window_days: "0"

  # ── Identity Layer ─────────────────────────────────────────────────────────
  zitadel:secret_recovery_window_days: "0"

  # ── EDI Application ────────────────────────────────────────────────────────
  edi-storage:noncurrent_version_retention_days: "7"
  edi-workers:edi_environment: "T"
  edi-workers:enable_observability: "true"
  edi-workers:image_tag: latest
  edi-as2:edi_environment: "T"
  edi-as2:enable_observability: "true"
  edi-as2:image_tag: latest

  # ── Unified Commerce Platform (UCP) Application ────────────────────────────
  ucp-workers:enable_observability: "true"
  ucp-workers:edi_environment: "T"
  ucp-workers:secret_recovery_window_days: "0"

  # ── Unified API Application ────────────────────────────────────────────────
  api:enable_observability: "true"
  api:edi_environment: "T"
