services:
  postgres_global:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ucp_admin
      POSTGRES_PASSWORD: ucp_password
      POSTGRES_DB: ucp_global
    ports:
      - "5432:5432"
    volumes:
      - postgres_global_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucp_admin -d ucp_global"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.5.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns,s3,secretsmanager
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - ./localstack-setup.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  sftp:
    image: atmoz/sftp:alpine
    ports:
      - "2222:22"
    command: testuser:pass:1001::upload

volumes:
  postgres_global_data:
