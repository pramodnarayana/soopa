services:
  postgres_global:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ucp_admin
      POSTGRES_PASSWORD: ucp_password
      POSTGRES_DB: global_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_global_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucp_admin -d global_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  sftp:
    image: atmoz/sftp:alpine
    ports:
      - "2222:22"
    command: testuser:pass:1001::upload

volumes:
  postgres_global_data:
