repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2000']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        args: [--ignore-words-list, "aer,contrl,datas,gir,fpt,ptd,ded,lod,mis,ser,som"]
        exclude: '^(apps/edi/packages/edi/src/edi/core/grammar/|apps/edi/packages/edi/src/edi/core/bots/|pnpm-lock\.yaml|.*\.json$)'
        additional_dependencies:
          - tomli

  - repo: https://github.com/semgrep/semgrep
    rev: v1.165.0
    hooks:
      - id: semgrep
        name: semgrep-enterprise
        args: ['--config=.semgrep/enterprise-rules.yml']

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        exclude: ^(libs/edi_grammar/|apps/edi/packages/edi/src/edi/core/grammar/)
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        exclude: ^(libs/edi_grammar/|apps/edi/packages/edi/src/edi/core/grammar/)
        require_serial: true
      - id: mypy
        name: mypy
        entry: pnpm typecheck
        language: system
        types_or: [python, pyi]
        exclude: ^(.*/)?scripts/.*$
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: pnpm lint
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false
      - id: biome
        name: biome
        entry: pnpm biome check
        language: system
        types_or: [javascript, jsx, ts, tsx, json]
        pass_filenames: false
      - id: tach
        name: tach
        entry: uv run tach check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pip-audit
        name: pip-audit
        entry: uv run --all-packages pip-audit
        language: system
        pass_filenames: false
      - id: pnpm-audit
        name: pnpm-audit
        entry: pnpm audit --prod
        language: system
        pass_filenames: false
