[project]
name = "as2_server"
version = "0.1.0"
description = "FastAPI HTTP Listener for incoming AS2 messages"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "gunicorn>=22.0.0",
    "prometheus-client>=0.20.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
