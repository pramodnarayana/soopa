[project]
name = "api"
version = "0.1.0"
description = "FastAPI Main Gateway for EDI Platform"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "gunicorn>=22.0.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aioboto3>=12.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
