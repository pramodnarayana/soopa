[project]
name = "worker"
version = "0.1.0"
description = "Worker service for handling provisioning and data orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=13.1.1",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    # Local dependencies
    "database",
    "pipeline",
    "config",
    "domain",
]

[tool.uv.sources]
database = { workspace = true }
pipeline = { workspace = true }
config = { workspace = true }
domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
