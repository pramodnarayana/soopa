[project]
name = "compute_worker"
version = "0.1.0"
description = "Heavy compute worker for EDI transformations"
requires-python = ">=3.11"
dependencies = [
    "transformer",
]

[tool.uv.sources]
transformer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_worker"]
