services:
  casdoor_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CASDOOR_POSTGRES_USER:-casdoor}
      POSTGRES_PASSWORD: ${CASDOOR_POSTGRES_PASSWORD:-casdoor_password}
      POSTGRES_DB: ${CASDOOR_POSTGRES_DB:-casdoor}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -d ${CASDOOR_POSTGRES_DB:-casdoor} -U ${CASDOOR_POSTGRES_USER:-casdoor}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - casdoor_data:/var/lib/postgresql/data:rw

  casdoor:
    image: casbin/casdoor:${CASDOOR_VERSION:?CASDOOR_VERSION must be set in versions.env}
    restart: unless-stopped
    environment:
      RUNNING_IN_DOCKER: "true"
      httpport: "8080"
      driverName: "postgres"
      dataSourceName: "user=${CASDOOR_POSTGRES_USER:-casdoor} password=${CASDOOR_POSTGRES_PASSWORD:-casdoor_password} host=casdoor_postgres port=5432 sslmode=disable dbname=${CASDOOR_POSTGRES_DB:-casdoor}"
      dbName: "${CASDOOR_POSTGRES_DB:-casdoor}"
      initAdminPassword: "${CASDOOR_ADMIN_PASSWORD:-Password1!}"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/local/casdoor/conf/app.conf:/conf/app.conf:ro
    depends_on:
      casdoor_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  casdoor_data:
