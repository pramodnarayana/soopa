[project]
name = "ucp_worker"
version = "0.1.0"
description = "Worker service for handling UCP Control Plane jobs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ucp",
    "ucp_models",
    "aioboto3>=13.1.1",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "config",
]

[tool.uv.sources]
ucp = { workspace = true }
ucp_models = { workspace = true }
config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ucp_worker"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "aioboto3",
    "aioboto3.*",
    "botocore",
    "botocore.*",
    "asyncpg",
]
ignore_missing_imports = true

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../packages/ucp/src",
    "../../packages/models/src",
    "../../../platform/packages/config/src",
    "src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
