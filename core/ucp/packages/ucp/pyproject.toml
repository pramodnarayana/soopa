[project]
name = "ucp"
version = "0.1.0"
description = "Universal Control Plane API"
requires-python = ">=3.12"
dependencies = [
    "ucp_models",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.31",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "platform-orm",
    "identity",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
line-length = 100


[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["B008", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    "src",
    "../../../../core/platform/apps/unified-api/src"
]
[tool.mypy]
strict = true

[tool.uv.sources]
ucp_models = { workspace = true }
platform-orm = { workspace = true }
identity = { workspace = true }
edi = { workspace = true }
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "testcontainers>=4.15.0",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.12",
]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
