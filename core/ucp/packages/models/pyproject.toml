[project]
name = "ucp_models"
version = "0.1.0"
description = "Universal Control Plane Domain Models"
authors = [
    {name = "Platform Team", email = "platform@company.com"}
]
requires-python = ">=3.11"
dependencies = ["sqlalchemy[asyncio]>=2.0.0", "platform-orm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucp_models"]

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"

[tool.uv.sources]
platform-orm = { workspace = true }
