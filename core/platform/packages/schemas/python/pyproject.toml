[project]
name = "soopa_schemas"
version = "0.1.0"
description = "Auto-generated Python models for Platform Schemas"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soopa_schemas"]

[tool.pyright]
venvPath = "../../../../.."
venv = ".venv"
extraPaths = [
    "../../identity/python/src",
    "../../observability/python/src",
    "src",
    "../../../../../apps/edi/packages/database/src",
    "../../../../../apps/edi/packages/pipeline/src",
    "../../../../../apps/edi/packages/grammar/src",
    "../../../../../apps/edi/packages/config/src",
    "../../../../../apps/edi/packages/security/src",
    "../../../../../apps/edi/packages/patches/src",
    "../../../../../apps/edi/packages/transformer/src",
    "../../../../../apps/edi/packages/as2_core/src",
    "../../../../../apps/edi/packages/bots_core/src",
    "../../../../../apps/edi/packages/domain/src",
    "../../../../../apps/edi/apps/edi-worker/compute/src",
    "../../../../../apps/edi/apps/edi-worker/ucp-sync/src",
    "../../../../../apps/edi/apps/edi-worker/orchestrator/src",
    "../../../../../apps/edi/apps/edi-as2-server/src",
    "../../../../../apps/edi/apps/edi-api/src",
]

[tool.ruff]
extend = "../../../../../pyproject.toml"
