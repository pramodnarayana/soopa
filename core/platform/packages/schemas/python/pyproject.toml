[project]
name = "soopa_schemas"
version = "0.1.0"
description = "Auto-generated Python models for Platform Schemas"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soopa_schemas"]
