[project]
name = "identity"
version = "0.1.0"
description = "Soopa identity contracts, authorization, and middleware for Python services."
authors = [{name = "Admin", email = "admin@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.115.4",
    "pyjwt[crypto]>=2.10.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
extend = "../../../../pyproject.toml"
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.deptry]
known_first_party = ["identity"]

[tool.deptry.package_module_name_map]
pyjwt = ["jwt"]

[tool.pyright]
venvPath = "../../../../.."
venv = ".venv"
extraPaths = [
    "src",
    "../../observability/python/src",
    "../../schemas/python/src",
    "../../../../../core/platform/packages/orm/src",
    "../../../../../apps/edi/packages/pipeline/src",
    "../../../../../apps/edi/packages/grammar/src",
    "../../../../../apps/edi/packages/config/src",
    "../../../../../apps/edi/packages/security/src",
    "../../../../../apps/edi/packages/patches/src",
    "../../../../../apps/edi/packages/transformer/src",
    "../../../../../apps/edi/packages/as2_core/src",
    "../../../../../apps/edi/packages/bots_core/src",
    "../../../../../apps/edi/packages/domain/src",
    "../../../../../apps/edi/apps/edi-worker/compute/src",
    "../../../../../apps/edi/apps/edi-worker/ucp-sync/src",
    "../../../../../apps/edi/apps/edi-worker/orchestrator/src",
    "../../../../../apps/edi/apps/edi-as2-server/src",
    "../../../../../apps/edi/packages/edi/src",
]
