[project]
name = "database"
version = "0.1.0"
description = "Platform Core ORM Bases and Utilities"
authors = [
    {name = "Platform Team", email = "platform@company.com"}
]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.18.5",
    "psycopg2-binary>=2.9.12",
    "ucp-models",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/database"]

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../identity/src",
    "../observability/python/src",
    "src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"

[tool.uv.sources]
ucp-models = { workspace = true }
