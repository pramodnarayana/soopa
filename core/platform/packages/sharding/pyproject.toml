[project]
name = "sharding"
version = "0.1.0"
description = "Enterprise-grade multi-tenant cellular sharding, consistent-hash bucket rings, and CQRS routing capability package"
requires-python = ">=3.11"
dependencies = [
    "seedwork",
    "database",
    "sqlalchemy>=2.0.0",
    "structlog>=24.0.0",
]

[tool.uv.sources]
seedwork = { workspace = true }
database = { workspace = true }

[tool.ruff]
extend = "../../../../pyproject.toml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharding"]
