[project]
name = "notification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.115.14",
    "jinja2>=3.1.6",
    "platform-orm",
    "outbox",
    "dependency-injector>=4.44.0",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    "ucp-models",
    "uvicorn>=0.51.0",
]

[tool.uv.sources]
platform-orm = { workspace = true }
ucp-models = { workspace = true }
outbox = { workspace = true }

[tool.ruff]
extend = "../../../../pyproject.toml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification"]
