[project]
name = "webhooks"
version = "0.1.0"
description = "Centralized Enterprise Webhooks Platform Package (Receivers & Dispatchers)"
authors = [
    {name = "Platform Team", email = "platform@soopa.com"}
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "seedwork",
    "shttp",
]

[tool.uv.sources]
seedwork = { workspace = true }
shttp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webhooks"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
