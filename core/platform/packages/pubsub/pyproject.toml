[project]
name = "pubsub"
version = "0.1.0"
description = "Generic AWS SQS and SNS Transport"
requires-python = ">=3.12"
dependencies = [
    "outbox",
    "database",
    "aioboto3",
    "structlog>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pubsub"]

[tool.uv.sources]
outbox = { workspace = true }
database = { workspace = true }
