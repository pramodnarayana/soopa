[project]
name = "outbox"
version = "0.1.0"
description = "Generic PostgreSQL Outbox Engine"
requires-python = ">=3.12"
dependencies = [
    "platform-orm",
    "asyncpg>=0.29.0",
    "structlog>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outbox"]

[tool.uv.sources]
platform-orm = { workspace = true }
