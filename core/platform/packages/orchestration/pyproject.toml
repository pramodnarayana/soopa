[project]
name = "orchestration"
version = "0.1.0"
description = "Enterprise-grade Hatchet-inspired Postgres durable orchestration engine for Soopa platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "seedwork",
    "observability",
    "database",
    "sqlalchemy>=2.0.51",
]

[tool.uv.sources]
seedwork = { workspace = true }
observability = { workspace = true }
database = { workspace = true }

[tool.ruff]
extend = "../../../../pyproject.toml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestration"]
