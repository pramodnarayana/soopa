[project]
name = "scheduler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "croniter>=6.2.4",
    "database",
    "pydantic>=2.0.0",
    "dependency-injector>=4.44.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.51",
    "types-croniter>=6.2.4.20260711",
    "ucp-models",
]

[tool.uv.sources]
database = { workspace = true }
ucp-models = { workspace = true }

[tool.ruff]
extend = "../../../../pyproject.toml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler"]

[tool.coverage.run]
omit = [
    "src/scheduler/adapters/outbound/messaging/sqs_job_dispatcher.py",
    "src/scheduler/adapters/outbound/database/uow.py"
]
