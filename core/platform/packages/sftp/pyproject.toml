[project]
name = "sftp"
version = "0.1.0"
description = "Centralized Enterprise SFTP and SSH Infrastructure Client"
authors = [
    { name = "Platform Team" }
]
dependencies = [
    "cryptography>=49.0.0",
    "paramiko>=3.4.0",
    "structlog>=24.1.0",
    "seedwork",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
seedwork = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/sftp"]
