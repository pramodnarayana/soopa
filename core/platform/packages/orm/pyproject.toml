[project]
name = "platform-orm"
version = "0.1.0"
description = "Platform Core ORM Bases and Utilities"
authors = [
    {name = "Platform Team", email = "platform@company.com"}
]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_orm"]

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../identity/python/src",
    "../observability/python/src",
    "src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
