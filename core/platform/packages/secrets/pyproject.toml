[project]
name = "secrets"
version = "0.1.0"
description = "Centralized AWS Secrets Manager Adapter"
authors = [
    { name = "Platform Team" }
]
dependencies = [
    "boto3>=1.34.0",
    "structlog>=24.0.0",
    "seedwork",
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
seedwork = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/secrets"]
