[project]
name = "replay"
version = "0.1.0"
description = "Universal Platform Replay Capability (core/platform/packages/replay)"
authors = [
    { name = "Platform Team" }
]
dependencies = [
    "seedwork",
    "observability",
    "structlog>=24.0.0",
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
seedwork = { workspace = true }
observability = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/replay"]
