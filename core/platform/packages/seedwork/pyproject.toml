[project]
name = "seedwork"
version = "0.1.0"
description = "Platform Core Domain Seedwork"
authors = [
    {name = "Platform Team", email = "platform@company.com"}
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seedwork"]

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
