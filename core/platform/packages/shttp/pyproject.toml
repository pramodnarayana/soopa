[project]
name = "shttp"
version = "0.1.0"
description = "Centralized Enterprise HTTP Client, SSRF Security, and Rate-Limit Resilience Package"
authors = [
    {name = "Platform Team", email = "platform@soopa.com"}
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "seedwork",
]

[tool.uv.sources]
seedwork = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shttp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-httpserver>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
