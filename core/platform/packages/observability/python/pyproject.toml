[project]
name = "observability"
version = "0.1.0"
description = "Shared Observability stack: Tracing, Metrics, and Logging for all EDI AS2 services"
authors = [
    {name = "EDI AS2 Team", email = "team@edi.com"}
]
requires-python = ">=3.11"
dependencies = [
    # OpenTelemetry — Traces
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    # Metrics
    "prometheus-client>=0.20.0",
    # Logging
    "structlog>=24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.deptry.per_rule_ignores]
DEP002 = [
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy"
]

[tool.deptry.package_module_name_map]
"opentelemetry-sdk" = ["opentelemetry"]

[tool.pyright]
venvPath = "../../../../.."
venv = ".venv"
extraPaths = [
    "../../identity/src",
    "src",
    "../../schemas/python/src",
    "../../../../../core/platform/packages/orm/src",
    "../../../../../apps/edi/packages/pipeline/src",
    "../../../../../apps/edi/packages/grammar/src",
    "../../../../../apps/edi/packages/config/src",
    "../../../../../apps/edi/packages/security/src",
    "../../../../../apps/edi/packages/patches/src",
    "../../../../../apps/edi/packages/transformer/src",
    "../../../../../apps/edi/packages/as2_core/src",
    "../../../../../apps/edi/packages/bots_core/src",
    "../../../../../apps/edi/packages/domain/src",
    "../../../../../apps/edi/apps/edi-worker/compute/src",
    "../../../../../apps/edi/apps/edi-worker/ucp-sync/src",
    "../../../../../apps/edi/apps/edi-worker/orchestrator/src",
    "../../../../../apps/edi/apps/edi-as2-server/src",
    "../../../../../apps/edi/packages/edi/src",
]

[tool.ruff]
extend = "../../../../../pyproject.toml"
