[project]
name = "cache"
version = "0.1.0"
description = "Enterprise-grade monotonic watermark-fenced read projection cache capability package"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.0.0",
]

[tool.ruff]
extend = "../../../../pyproject.toml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cache"]
