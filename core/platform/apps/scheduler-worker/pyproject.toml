[project]
name = "scheduler-worker"
version = "0.1.0"
description = "Scheduler Worker Application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "scheduler",
    "aioboto3>=13.1.1",
    "dependency-injector>=4.44.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "pydantic>=2.0.0",
]

[tool.uv.sources]
scheduler = { workspace = true }

[tool.ruff]
extend = "../../../../pyproject.toml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler_worker"]
