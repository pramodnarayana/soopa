[project]
name = "platform-migrator"
version = "0.1.0"
description = "Programmatic Database Migration and Seeding CLI"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "structlog>=24.4.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "database",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_migrator"]

[tool.uv.sources]
database = { workspace = true }
