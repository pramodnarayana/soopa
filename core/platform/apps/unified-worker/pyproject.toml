[project]
name = "unified-worker"
version = "0.1.0"
description = "Unified Background Worker Launcher"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "structlog>=24.4.0",
    "pydantic>=2.10.0",
    "identity_worker",
    "identity_jobs_worker",
    "notification_worker",
    "notification_jobs_worker",
    "notification_channel_worker",
    "ucp_worker",
    "ucp_jobs_worker",
    "scheduler_worker",
    "orchestrator_worker",
    "edi_delivery_worker",
    "compute_worker",
    "config_sync_worker",
    "edi_cp_worker",
    "edi_dp_jobs_worker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unified_worker"]

[tool.uv.sources]
database = { workspace = true }
identity = { workspace = true }
observability = { workspace = true }
pubsub = { workspace = true }
ucp = { workspace = true }
ucp_models = { workspace = true }
identity_worker = { workspace = true }
identity_jobs_worker = { workspace = true }
notification_worker = { workspace = true }
notification_jobs_worker = { workspace = true }
notification_channel_worker = { workspace = true }
ucp_worker = { workspace = true }
ucp_jobs_worker = { workspace = true }
scheduler_worker = { workspace = true }
orchestrator_worker = { workspace = true }
edi_delivery_worker = { workspace = true }
compute_worker = { workspace = true }
config_sync_worker = { workspace = true }
edi_cp_worker = { workspace = true }
edi_dp_jobs_worker = { workspace = true }
