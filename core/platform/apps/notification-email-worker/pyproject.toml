[project]
name = "notification_email_worker"
version = "0.1.0"
description = "Worker service for handling Email notifications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "notification",
    "pubsub",
    "database",
    "observability",
    "aioboto3>=13.1.1",
    "sqlalchemy>=2.0.29",
    "structlog"
]

[tool.uv.sources]
notification = { workspace = true }
pubsub = { workspace = true }
database = { workspace = true }
observability = { workspace = true }

[tool.deptry]
known_first_party = ["notification_email_worker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "mypy",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notification_email_worker"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "aioboto3",
    "aioboto3.*",
    "botocore",
    "botocore.*",
]
ignore_missing_imports = true

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../packages/notification/src",
    "../../packages/pubsub/src",
    "../../packages/database/src",
    "../../packages/observability/src",
    "src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
