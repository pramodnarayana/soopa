[project]
name = "notification_worker"
version = "0.1.0"
description = "Worker service for handling Notification outbox sweeping and delivery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "notification",
    "aioboto3",
    "structlog",
]

[tool.uv.sources]
notification = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notification_worker"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "asyncpg",
]
ignore_missing_imports = true

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../packages/notification/src",
    "src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
