[project]
name = "identity_outbox_worker"
version = "0.1.0"
description = "Worker service for handling Identity outbox relay and sweeping"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "identity",
    "outbox",
    "pubsub",
    "database",
    "observability",
    "aioboto3>=13.1.1",
    "sqlalchemy>=2.0.29",
    "structlog"
]

[tool.uv.sources]
identity = { workspace = true }
outbox = { workspace = true }
pubsub = { workspace = true }
database = { workspace = true }
observability = { workspace = true }

[tool.deptry]
known_first_party = ["identity_outbox_worker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/identity_outbox_worker"]

[tool.mypy]
strict = true
disable_error_code = ["prop-decorator"]

[[tool.mypy.overrides]]
module = [
    "aioboto3",
    "aioboto3.*",
    "botocore",
    "botocore.*",
    "asyncpg",
]
ignore_missing_imports = true

[tool.pyright]
venvPath = "../../../.."
venv = ".venv"
extraPaths = [
    "../../packages/identity/src",
    "../../packages/outbox/src",
    "../../packages/pubsub/src",
    "../../packages/database/src",
    "../../packages/observability/src",
    "src",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
