[project]
name = "unified-api"
version = "0.1.0"
description = "Universal Control Plane - Unified Shell Host"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "ucp",
    "edi",
    "observability",
    "notification",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[tool.ruff]
extend = "../../../../pyproject.toml"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["B008", "E402"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unified_api"]
[tool.mypy]
strict = true

[tool.uv.sources]
ucp = { workspace = true }
edi = { workspace = true }
observability = { workspace = true }
notification = { workspace = true }

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
]
