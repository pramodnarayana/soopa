version: '3.8'

services:
  postgres_global:
    image: postgres:16-alpine
    container_name: postgres_global
    environment:
      POSTGRES_USER: ucp_admin
      POSTGRES_PASSWORD: ucp_password
      POSTGRES_DB: ucp_global
    ports:
      - "5432:5432"
    volumes:
      - postgres_global_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucp_admin -d ucp_global"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.5.0
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns,s3
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - ./localstack-setup.sh:/etc/localstack/init/ready.d/init.sh
      - ../../apps/edi/docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/edi-init.sh

volumes:
  postgres_global_data:
    name: postgres_global_data
