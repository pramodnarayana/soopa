name: Platform CI

on:
  push:
    branches: [ "main", "development" ]
    paths:
      - 'core/platform/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'core/platform/**'
      - '.github/workflows/platform-ci.yml'

jobs:
  build-lint-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ucp_admin:ucp_password@localhost:5434/ucp_global
      POSTGRES_PASSWORD: zitadel_password
      ZITADEL_MASTERKEY: a-32-byte-long-secret-key-for-zitadel-in-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: "0.5.21"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: pnpm install

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Typecheck (Node)
        run: turbo typecheck --filter="./core/platform/**"

      - name: Lint (Node)
        run: turbo lint --filter="./core/platform/**"

      - name: Start Database
        run: |
          docker compose up -d ucp_postgres_global ucp_postgres_shard_1 --wait
          pnpm db:migrate

      - name: Test (Node)
        run: CI=true turbo test --filter="./core/platform/**"

      - name: Test (Python)
        run: |
          for d in core/platform/packages/*/python core/platform/apps/*; do
            if [ -f "$d/pyproject.toml" ]; then
              (cd "$d" && uv run pytest)
            fi
          done

      - name: Build (Node)
        run: turbo build --filter="./core/platform/**"
