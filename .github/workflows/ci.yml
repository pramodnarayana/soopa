name: Modular Monolith CI

on:
  push:
    branches: [ "main", "development", "ip_development", "ip/*" ]
  pull_request:
    branches: [ "main", "development", "ip_development", "ip/*" ]


permissions:
  contents: read
  pull-requests: write
  id-token: write


jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-validate-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Verify Python-to-Turborepo Manifest Parity
        run: pnpm run syncpack:python:check

      - name: Architectural Boundary Check (Tach)
        run: uv run tach check

      - name: Lint & Format Check (Python)
        run: |
          uv run ruff check apps core infra/local/scripts scripts
          uv run ruff format --check apps core infra/local/scripts scripts
          uv run mypy --explicit-package-bases infra/local/scripts/run_in_test_env.py infra/local/scripts/ensure_test_databases.py infra/local/scripts/sync_topology.py scripts/aggregate_coverage.py

      - name: Architectural & Enterprise Static Analysis (Semgrep)
        run: uv run --with "semgrep==1.165.0" semgrep --config=semgrep-architecture.yml --config=.semgrep/enterprise-rules.yml --exclude node_modules --exclude .venv --exclude dist --exclude build --error apps core

      - name: Typecheck (Node & Python)
        run: pnpm turbo typecheck

      - name: Typecheck Tests (Node & Python)
        run: pnpm turbo typecheck:tests

      - name: Lint (Workspaces)
        run: pnpm turbo lint

      - name: Build All Workspaces (Node & Dashboard Validation)
        run: pnpm turbo build

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-unit-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Test (Node)
        run: CI=true pnpm test:node

      - name: Test with Coverage (Python)
        run: COVERAGE_FILE=.coverage.unit CI=true pnpm cov:python

      - name: Upload Unit Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: |
            **/.coverage.unit
            !**/node_modules/**
          include-hidden-files: true

  test-integration:
    name: Integration Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-integration-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            infra_cmd: pnpm infra:up && pnpm infra:init-edi
            test_cmd: pnpm test:integration:core
          - shard: edi
            infra_cmd: pnpm infra:up:edi && pnpm infra:init-edi
            test_cmd: pnpm test:integration:edi
          - shard: ip
            infra_cmd: pnpm infra:up:ip
            test_cmd: pnpm test:integration:ip
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Start Database & Infra (${{ matrix.shard }})
        run: |
          cp .env.example .env
          ${{ matrix.infra_cmd }}

      - name: Test Integration (${{ matrix.shard }})
        run: COVERAGE_FILE=.coverage.integration CI=true ${{ matrix.test_cmd }}

      - name: Upload Integration Coverage (${{ matrix.shard }})
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-${{ matrix.shard }}
          path: |
            **/.coverage.integration
            !**/node_modules/**
          include-hidden-files: true

  build-docker:
    name: Build Modular Monolith
    needs: [validate, test-unit]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-build-docker-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build Modular Monolith Docker Image
        uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc # v6.11.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: modular-monolith:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  coverage-gate:
    name: Coverage Check
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage_artifacts
          merge-multiple: false

      - name: Aggregate Coverage
        run: ./scripts/aggregate_coverage.py --artifacts-dir coverage_artifacts
