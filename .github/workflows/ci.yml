name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev --all-packages

      - name: Run Formatter Check
        run: uv run ruff format --check libs/ services/

      - name: Run Linter
        run: uv run ruff check libs/ services/

      - name: Run Typechecker
        run: uv run mypy libs/ services/

      - name: Run Tests
        run: uv run pytest libs/ services/ --cov=. --cov-report=xml

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
