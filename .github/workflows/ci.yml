name: Modular Monolith CI

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Filter Changed Paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            infra:
              - 'infra/cloud/aws/**'
              - '!infra/cloud/aws/apps/api/**'
              - '!infra/cloud/aws/apps/ucp/**'
              - '!infra/cloud/aws/apps/edi/**'
              - '!infra/cloud/aws/apps/migrator/**'
              - 'infra/cloud/zitadel/**'
              - 'versions.env'
              - '.github/workflows/provision-infra.yml'
              - '.github/actions/pulumi-*/**'
            apps:
              - 'apps/**'
              - 'core/**'
              - 'Dockerfile'
              - 'infra/cloud/aws/apps/**'

  validate:
    name: Validate (Lint, Typecheck & Build)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-validate-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Typecheck (Node)
        run: pnpm turbo typecheck

      - name: Typecheck Tests (Node)
        run: pnpm turbo typecheck:tests

      - name: Lint (Node)
        run: pnpm turbo lint

      - name: Build All Workspaces (Node & Dashboard Validation)
        run: pnpm turbo build

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-unit-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Test (Node)
        run: CI=true pnpm test:node

      - name: Test with Coverage (Python)
        run: COVERAGE_FILE=.coverage.unit CI=true pnpm cov:python

      - name: Upload Unit Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: "**/.coverage.unit"
          include-hidden-files: true

  test-integration:
    name: Integration Tests
    needs: [validate, test-unit]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-integration-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Start Database & Infrastructure
        run: |
          cp .env.example .env
          pnpm infra:up

      - name: Test (Integration)
        run: COVERAGE_FILE=.coverage.integration CI=true pnpm test:integration

      - name: Upload Integration Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: "**/.coverage.integration"
          include-hidden-files: true

      - name: Test Infrastructure (Pulumi Mocks)
        run: |
          cd infra/cloud/aws
          uv run pytest tests/

  build-docker:
    name: Build Modular Monolith
    needs: [validate, test-unit]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-build-docker-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build Modular Monolith Docker Image
        uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc # v6.11.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: modular-monolith:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  coverage-gate:
    name: Coverage Check
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage_artifacts
          merge-multiple: false

      - name: Aggregate Coverage
        run: |
          cp -a coverage_artifacts/coverage-unit/. ./ || true
          cp -a coverage_artifacts/coverage-integration/. ./ || true
          ./scripts/aggregate_coverage.py

  # ---------------------------------------------------------------------------
  # Phase 1 Gate (Pre-Merge): Speculative Infrastructure Preview
  # Triggers on Pull Requests ONLY after all tests & coverage gates succeed.
  # ---------------------------------------------------------------------------
  infra-preview:
    name: Preview Permanent Infrastructure (Staging)
    needs: [detect-changes, coverage-gate]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.infra == 'true'
    uses: ./.github/workflows/provision-infra.yml
    with:
      target_env: staging
      action: preview
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Phase 2 (Post-Merge): Continuous Delivery (Staging)
  # Triggers when code is merged into development.
  # Order: 1. Provision Permanent Infra -> 2. Application Deployment & Migrations
  # ---------------------------------------------------------------------------
  infra-provision-staging:
    name: Provision Permanent Infrastructure (Staging)
    needs: [detect-changes, coverage-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    uses: ./.github/workflows/provision-infra.yml
    with:
      target_env: staging
      action: apply
      skip_if_unchanged: true
      infra_changed: ${{ needs.detect-changes.outputs.infra == 'true' }}
    secrets: inherit

  deploy-staging:
    name: Deploy Applications to AWS (Staging)
    needs: [build-docker, coverage-gate, infra-provision-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Phase 2 (Post-Merge): Continuous Delivery (Production)
  # Triggers when code is merged into main.
  # Order: 1. Provision Permanent Infra -> 2. Application Deployment & Migrations
  # ---------------------------------------------------------------------------
  infra-provision-prod:
    name: Provision Permanent Infrastructure (Production)
    needs: [detect-changes, coverage-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/provision-infra.yml
    with:
      target_env: production
      action: apply
      skip_if_unchanged: true
      infra_changed: ${{ needs.detect-changes.outputs.infra == 'true' }}
    secrets: inherit

  deploy-prod:
    name: Deploy Applications to AWS (Production)
    needs: [build-docker, coverage-gate, infra-provision-prod]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
    secrets: inherit
