name: Modular Monolith CI

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Typecheck (Node)
        run: pnpm turbo typecheck

      - name: Typecheck Tests (Node)
        run: pnpm turbo typecheck:tests

      - name: Lint (Node)
        run: pnpm turbo lint

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-unit-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Test (Node)
        run: CI=true pnpm test:node

      - name: Test with Coverage (Python)
        run: CI=true pnpm cov:python

  test-integration:
    name: Integration Tests
    needs: [lint-and-typecheck, test-unit]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-integration-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Start Database & Infrastructure
        run: |
          docker compose up -d postgres_global edi_postgres_shard localstack debezium_shard otel-collector sftp --wait
          pnpm db:migrate:platform
          pnpm db:seed
          pnpm db:migrate:edi

      - name: Test (Integration)
        run: CI=true pnpm test:integration

      - name: Test Infrastructure (Pulumi Mocks)
        run: |
          cd infra/cloud/aws
          uv run pytest tests/

  build-docker:
    name: Build Modular Monolith
    needs: [lint-and-typecheck, test-unit]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-build-docker-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build Modular Monolith Docker Image
        uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc # v6.11.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: modular-monolith:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
