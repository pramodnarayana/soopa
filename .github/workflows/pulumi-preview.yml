name: Pulumi PR Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/cloud/aws/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Preview Infrastructure Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pulumi CLI
        run: curl -fsSL https://get.pulumi.com | sh

      - name: Add Pulumi to PATH
        run: echo "$HOME/.pulumi/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          cd infra/cloud/aws
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Pulumi Preview (Platform)
        uses: pulumi/actions@v5
        with:
          command: preview
          stack-name: dev
          work-dir: infra/cloud/aws/platform
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Check Pulumi Policies (CrossGuard)
        run: |
          source infra/cloud/aws/.venv/bin/activate
          cd infra/cloud/aws/platform
          pulumi preview --policy-pack ../policy -s dev
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
