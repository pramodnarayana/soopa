name: Pulumi PR Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/cloud/aws/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Preview Infrastructure Changes
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.13'

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2

      - name: Install Python dependencies
        run: |
          cd infra/cloud/aws
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Pulumi Preview (Platform)
        uses: pulumi/actions@cd99a7f8865434dd3532b586a26f9ebea596894f # v5
        with:
          command: preview
          stack-name: dev
          work-dir: infra/cloud/aws/platform
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Check Pulumi Policies (CrossGuard)
        run: |
          source infra/cloud/aws/.venv/bin/activate
          cd infra/cloud/aws/platform
          pulumi preview --policy-pack ../policy -s dev
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
