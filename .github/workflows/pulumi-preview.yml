name: Pulumi PR Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/cloud/aws/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Preview Infrastructure Changes
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2

      - name: Setup Infra Virtual Environment
        run: |
          cd infra/cloud/aws
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e . -e packages/seedwork

      - name: Pulumi S3 Login
        run: pulumi login s3://iac-state-platform-634680389104
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: Pulumi Preview (Platform)
        run: |
          source infra/cloud/aws/.venv/bin/activate
          cd infra/cloud/aws/platform
          pulumi preview -s staging
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_SKIP_UPDATE_CHECK: 'true'

      - name: Check Pulumi Policies (CrossGuard)
        run: |
          source infra/cloud/aws/.venv/bin/activate
          cd infra/cloud/aws/platform
          pulumi preview --policy-pack ../policy -s staging
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_SKIP_UPDATE_CHECK: 'true'
