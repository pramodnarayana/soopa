name: Deploy Infrastructure and Applications

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_REGION: us-east-1
      PULUMI_SKIP_UPDATE_CHECK: 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install uv (Fast Python Package Installer)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2

      - name: Enterprise Config (cp .env.example .env)
        run: cp .env.example .env

      - name: Create Python venv and Install Requirements
        run: |
          cd infra/cloud/aws
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Deploy Foundation Stack
        run: |
          source $GITHUB_WORKSPACE/infra/cloud/aws/.venv/bin/activate
          cd $GITHUB_WORKSPACE/infra/cloud/aws/foundation
          pulumi up -s prod -y

      - name: Deploy Platform Stack
        run: |
          source $GITHUB_WORKSPACE/infra/cloud/aws/.venv/bin/activate
          cd $GITHUB_WORKSPACE/infra/cloud/aws/platform
          pulumi up -s prod -y

      - name: Deploy OpenObserve Stack
        run: |
          source $GITHUB_WORKSPACE/infra/cloud/aws/.venv/bin/activate
          cd $GITHUB_WORKSPACE/infra/cloud/aws/openobserve
          pulumi up -s prod -y

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.0.1

      - name: Sync Third-Party Images (Zitadel)
        run: |
          ./infra/cloud/aws/platform/sync-images.sh

      - name: Deploy Zitadel Infrastructure Stack
        run: |
          source $GITHUB_WORKSPACE/infra/cloud/aws/.venv/bin/activate
          cd $GITHUB_WORKSPACE/infra/cloud/aws/zitadel
          pulumi up -s prod -y

      - name: Wait for Zitadel API to become healthy
        run: |
          echo "Waiting 60s for Zitadel ECS task to spin up and upload the machine key..."
          sleep 60

      - name: Deploy Zitadel Identity Configuration
        run: |
          # This configures projects and apps using the Zitadel Pulumi Provider
          source $GITHUB_WORKSPACE/infra/cloud/aws/.venv/bin/activate
          cd $GITHUB_WORKSPACE/infra/cloud/zitadel
          pulumi up -s prod -y

      - name: Build, Tag, and Push Modular Monolith Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
          ECR_REPOSITORY: "prod-modular-monolith"
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy Application Stacks
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          source $GITHUB_WORKSPACE/infra/cloud/aws/.venv/bin/activate

          echo "Deploying API Stack..."
          cd $GITHUB_WORKSPACE/infra/cloud/aws/apps/api
          pulumi config set image_tag $IMAGE_TAG -s prod
          pulumi up -s prod -y

          echo "Deploying EDI Stack..."
          cd $GITHUB_WORKSPACE/infra/cloud/aws/apps/edi
          pulumi config set image_tag $IMAGE_TAG -s prod
          pulumi up -s prod -y

          echo "Deploying UCP Stack..."
          cd $GITHUB_WORKSPACE/infra/cloud/aws/apps/ucp
          pulumi config set image_tag $IMAGE_TAG -s prod
          pulumi up -s prod -y

          echo "Deploying Identity Stack..."
          cd $GITHUB_WORKSPACE/infra/cloud/aws/apps/identity
          pulumi config set image_tag $IMAGE_TAG -s prod
          pulumi up -s prod -y

          echo "Deploying Notification Stack..."
          cd $GITHUB_WORKSPACE/infra/cloud/aws/apps/notification
          pulumi config set image_tag $IMAGE_TAG -s prod
          pulumi up -s prod -y

          echo "Deploying Scheduler Stack..."
          cd $GITHUB_WORKSPACE/infra/cloud/aws/apps/scheduler
          pulumi config set image_tag $IMAGE_TAG -s prod
          pulumi up -s prod -y

      - name: Run Database Migrations
        run: |
          echo "Running Database Migrations against AWS RDS..."
          # Note: In a true prod environment, these should run securely against the RDS endpoint
          # either via a bastion, VPN, or a dedicated ECS migration task.
          cd $GITHUB_WORKSPACE/core/platform/packages/database
          uv run alembic upgrade head

          cd $GITHUB_WORKSPACE/apps/edi/packages/edi
          uv run python src/edi/adapters/outbound/database/run_migrations.py

      - name: Run Data Seeding
        run: |
          echo "Running Initial Seed Scripts..."
          cd $GITHUB_WORKSPACE
          python core/ucp/packages/ucp/scripts/seed.py
          python core/platform/apps/identity-jobs-worker/scripts/seed_jobs.py
          python apps/edi/scripts/seed_jobs.py
