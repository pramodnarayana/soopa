name: Deploy Infrastructure and Applications

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target deployment environment (staging or prod)'
        required: true
        type: string
        default: 'staging'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AWS (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    concurrency:
      group: deploy-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      PULUMI_SKIP_UPDATE_CHECK: 'true'
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      TARGET_ENV: ${{ inputs.environment || 'staging' }}
      STATE_BUCKET: s3://iac-state-platform-634680389104

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Environment (Node, Python, pnpm, uv)
        uses: ./.github/actions/setup-env

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2

      - name: Setup Pulumi Virtual Environments
        run: |
          # 1. Setup AWS Infra Virtualenv
          cd $GITHUB_WORKSPACE/infra/cloud/aws
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e . -e packages/seedwork

          # 2. Setup Zitadel Provider Virtualenv
          cd $GITHUB_WORKSPACE/infra/cloud/zitadel
          uv venv .venv
          source .venv/bin/activate
          uv pip install -r requirements.txt

          # 3. Create Virtualenv Symlinks for micro-stacks
          mkdir -p $GITHUB_WORKSPACE/infra/cloud/aws/packages/seedwork
          ln -sfn $GITHUB_WORKSPACE/infra/cloud/aws/.venv $GITHUB_WORKSPACE/infra/cloud/aws/packages/seedwork/.venv
          ln -sfn $GITHUB_WORKSPACE/infra/cloud/aws/.venv $GITHUB_WORKSPACE/infra/.venv

      - name: Pulumi S3 Login (Open-Source State)
        run: pulumi login ${{ env.STATE_BUCKET }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.0.1

      - name: Build, Tag, and Push Modular Monolith Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
          ECR_REPOSITORY: ${{ env.TARGET_ENV }}-app-image
        run: |
          echo "Building Docker image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          echo "Pushing Docker image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy Infrastructure, Migrations, Application Stacks & Frontend
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          source $GITHUB_WORKSPACE/infra/cloud/aws/.venv/bin/activate
          ./infra/scripts/ci_deploy.sh ${{ env.TARGET_ENV }}
