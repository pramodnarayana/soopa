name: Continuous Delivery (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Filter Changed Paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            infra:
              - 'infra/cloud/aws/**'
              - '!infra/cloud/aws/apps/api/**'
              - '!infra/cloud/aws/apps/ucp/**'
              - '!infra/cloud/aws/apps/edi/**'
              - '!infra/cloud/aws/apps/migrator/**'
              - 'infra/cloud/zitadel/**'
              - 'versions.env'
              - '.github/workflows/provision-infra.yml'
              - '.github/workflows/preview-infra.yml'
              - '.github/actions/pulumi-*/**'
            apps:
              - 'apps/**'
              - 'core/**'
              - 'Dockerfile'
              - 'infra/cloud/aws/apps/**'

  infra-provision-prod:
    name: Provision Permanent Infrastructure (Production)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.infra == 'true' || needs.detect-changes.outputs.apps == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/provision-infra.yml
    with:
      target_env: production
      skip_if_unchanged: true
      infra_changed: ${{ needs.detect-changes.outputs.infra == 'true' }}
    secrets: inherit

  deploy-prod:
    name: Deploy Applications to AWS (Production)
    needs: [detect-changes, infra-provision-prod]
    if: (needs.detect-changes.outputs.apps == 'true' || needs.detect-changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch') && !cancelled() && !failure()
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
    secrets: inherit
