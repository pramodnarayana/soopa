name: Continuous Delivery (Production)

on:
  workflow_run:
    workflows: ["Modular Monolith CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy Applications to AWS (Production)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      commit_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
