name: Provision Permanent Cloud Infrastructure

on:
  workflow_call:
    inputs:
      target_env:
        description: 'Target environment (staging or production)'
        required: true
        type: string
        default: 'staging'
      action:
        description: 'Action to perform: preview or apply'
        required: true
        type: string
        default: 'preview'
      skip_if_unchanged:
        description: 'Whether to check if infra changed before applying'
        required: false
        type: boolean
        default: false
      infra_changed:
        description: 'Whether infra files changed'
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      action:
        description: 'Action to perform'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - apply

permissions:
  contents: read
  id-token: write


concurrency:
  group: provision-infra-${{ inputs.target_env || inputs.environment || 'staging' }}-${{ inputs.action || 'preview' }}
  cancel-in-progress: false

jobs:
  preview:
    name: Preview Permanent Infrastructure (${{ inputs.target_env || inputs.environment || 'staging' }})
    if: (inputs.action || 'preview') == 'preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      AWS_REGION: us-east-1
      TARGET_ENV: ${{ (inputs.target_env == 'prod' || inputs.environment == 'prod' || inputs.target_env == 'production' || inputs.environment == 'production') && 'production' || 'staging' }}
      STATE_BUCKET: ${{ vars.PULUMI_STATE_BUCKET || 's3://iac-state-platform-634680389104' }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check Fork Pull Request Status
        id: check-fork
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "is_fork=true" >> $GITHUB_OUTPUT
            echo "::notice::Pull request originates from a fork where AWS secrets are restricted. Skipping credentialed preview."
          else
            echo "is_fork=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials (OIDC Federation)
        if: steps.check-fork.outputs.is_fork != 'true'
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN || 'arn:aws:iam::634680389104:role/flowwolf-github-preview-role' }}
          role-session-name: github-actions-preview-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Setup Environment (Node, Python, pnpm, uv)
        uses: ./.github/actions/setup-env

      - name: Pulumi Setup
        uses: ./.github/actions/pulumi-setup
        with:
          state-bucket: ${{ env.STATE_BUCKET }}
          pulumi-config-passphrase: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: Preview Foundation (VPC & Networking)
        uses: ./.github/actions/pulumi-stack-preview
        with:
          stack-dir: infra/cloud/aws/foundation
          stack-name: ${{ env.TARGET_ENV }}

      - name: Preview Data (Aurora RDS & KMS)
        uses: ./.github/actions/pulumi-stack-preview
        with:
          stack-dir: infra/cloud/aws/data
          stack-name: ${{ env.TARGET_ENV }}

      - name: Preview Platform (ECS Cluster & ECR)
        uses: ./.github/actions/pulumi-stack-preview
        with:
          stack-dir: infra/cloud/aws/platform
          stack-name: ${{ env.TARGET_ENV }}

      - name: Preview OpenObserve
        uses: ./.github/actions/pulumi-stack-preview
        with:
          stack-dir: infra/cloud/aws/openobserve
          stack-name: ${{ env.TARGET_ENV }}

      - name: Preview Zitadel Infrastructure
        uses: ./.github/actions/pulumi-stack-preview
        with:
          stack-dir: infra/cloud/aws/zitadel
          stack-name: ${{ env.TARGET_ENV }}

      - name: Preview Zitadel Configuration
        uses: ./.github/actions/pulumi-stack-preview
        with:
          stack-dir: infra/cloud/zitadel
          stack-name: ${{ env.TARGET_ENV }}

      - name: Preview OpenAS2
        uses: ./.github/actions/pulumi-stack-preview
        with:
          stack-dir: infra/cloud/aws/apps/openas2
          stack-name: ${{ env.TARGET_ENV }}

      - name: Preview Dashboard Infrastructure (S3 & CloudFront)
        uses: ./.github/actions/pulumi-stack-preview
        with:
          stack-dir: infra/cloud/aws/apps/dashboard
          stack-name: ${{ env.TARGET_ENV }}

      - name: Preview Global Routing
        uses: ./.github/actions/pulumi-stack-preview
        with:
          stack-dir: infra/cloud/aws/apps/routing
          stack-name: ${{ env.TARGET_ENV }}

  apply:
    name: Provision Permanent Infrastructure (${{ inputs.target_env || inputs.environment || 'staging' }})
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ (inputs.target_env == 'prod' || inputs.environment == 'prod' || inputs.target_env == 'production' || inputs.environment == 'production') && 'production' || 'staging' }}
    env:
      AWS_REGION: us-east-1
      TARGET_ENV: ${{ (inputs.target_env == 'prod' || inputs.environment == 'prod' || inputs.target_env == 'production' || inputs.environment == 'production') && 'production' || 'staging' }}
      STATE_BUCKET: ${{ vars.PULUMI_STATE_BUCKET || 's3://iac-state-platform-634680389104' }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check If Infrastructure Changed
        id: check-infra
        shell: bash
        run: |
          if [ "${{ inputs.skip_if_unchanged }}" = "true" ] && [ "${{ inputs.infra_changed }}" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Permanent cloud infrastructure unchanged. Skipping Pulumi apply."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials (OIDC Federation)
        if: steps.check-infra.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYER_ROLE_ARN || 'arn:aws:iam::634680389104:role/flowwolf-github-deployer-role' }}
          role-session-name: github-actions-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Setup Environment (Node, Python, pnpm, uv)
        if: steps.check-infra.outputs.skip != 'true'
        uses: ./.github/actions/setup-env

      - name: Pulumi Setup
        if: steps.check-infra.outputs.skip != 'true'
        uses: ./.github/actions/pulumi-setup
        with:
          state-bucket: ${{ env.STATE_BUCKET }}
          pulumi-config-passphrase: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      # Step 1: Core Network & Database Foundation
      - name: Deploy Foundation (VPC & Networking)
        if: steps.check-infra.outputs.skip != 'true'
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/foundation
          stack-name: ${{ env.TARGET_ENV }}

      - name: Deploy Data (Aurora RDS & KMS)
        if: steps.check-infra.outputs.skip != 'true'
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/data
          stack-name: ${{ env.TARGET_ENV }}

      - name: Deploy Platform (ECS Cluster & ECR)
        if: steps.check-infra.outputs.skip != 'true'
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/platform
          stack-name: ${{ env.TARGET_ENV }}

      # Step 2: Third-Party Images Sync (OpenObserve, Zitadel)
      - name: Sync Third-Party Container Images to ECR
        if: steps.check-infra.outputs.skip != 'true'
        shell: bash
        run: |
          ./infra/cloud/aws/platform/sync-images.sh "${{ env.TARGET_ENV }}"

      # Step 3: Platform Services & Identity
      - name: Deploy OpenObserve
        if: steps.check-infra.outputs.skip != 'true'
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/openobserve
          stack-name: ${{ env.TARGET_ENV }}

      - name: Deploy Zitadel Infrastructure
        if: steps.check-infra.outputs.skip != 'true'
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/zitadel
          stack-name: ${{ env.TARGET_ENV }}

      - name: Deploy Zitadel Configuration
        if: steps.check-infra.outputs.skip != 'true'
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/zitadel
          stack-name: ${{ env.TARGET_ENV }}

      # Step 4: Tools, Dashboard Infra & Global Routing
      - name: Deploy OpenAS2 Partner Server
        if: steps.check-infra.outputs.skip != 'true'
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/apps/openas2
          stack-name: ${{ env.TARGET_ENV }}

      - name: Deploy Dashboard Infrastructure (S3 & CloudFront)
        if: steps.check-infra.outputs.skip != 'true'
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/apps/dashboard
          stack-name: ${{ env.TARGET_ENV }}

      - name: Deploy Global Edge Routing
        if: steps.check-infra.outputs.skip != 'true'
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/apps/routing
          stack-name: ${{ env.TARGET_ENV }}
