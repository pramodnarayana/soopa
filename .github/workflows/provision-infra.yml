name: Cloud Infrastructure Rollout

on:
  push:
    branches:
      - development
      - main
    paths:
      - 'infra/cloud/aws/**'
      - '!infra/cloud/aws/apps/api/**'
      - '!infra/cloud/aws/apps/ucp/**'
      - '!infra/cloud/aws/apps/edi/**'
      - '!infra/cloud/aws/apps/migrator/**'
      - 'infra/cloud/zitadel/**'
      - 'versions.env'
      - '.github/workflows/provision-infra.yml'
      - '.github/workflows/preview-infra.yml'
      - '.github/workflows/check-infra.yml'
      - '.github/actions/pulumi-*/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  workflow_call:
    inputs:
      target_env:
        description: 'Target environment (staging or production)'
        required: false
        type: string
        default: 'staging'
      commit_sha:
        description: 'Specific commit SHA to checkout'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: provision-infra-${{ (inputs.environment == 'prod' || inputs.environment == 'production' || inputs.target_env == 'prod' || inputs.target_env == 'production') && 'production' || (inputs.environment == 'staging' || inputs.target_env == 'staging') && 'staging' || (github.event_name == 'push' && github.ref_name == 'main') && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  apply:
    name: Rollout (${{ (inputs.environment == 'prod' || inputs.environment == 'production' || inputs.target_env == 'prod' || inputs.target_env == 'production') && 'production' || (inputs.environment == 'staging' || inputs.target_env == 'staging') && 'staging' || (github.event_name == 'push' && github.ref_name == 'main') && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ (inputs.environment == 'prod' || inputs.environment == 'production' || inputs.target_env == 'prod' || inputs.target_env == 'production') && 'production' || (inputs.environment == 'staging' || inputs.target_env == 'staging') && 'staging' || (github.event_name == 'push' && github.ref_name == 'main') && 'production' || 'staging' }}
    env:
      AWS_REGION: us-east-1
      TARGET_ENV: ${{ (inputs.environment == 'prod' || inputs.environment == 'production' || inputs.target_env == 'prod' || inputs.target_env == 'production') && 'production' || (inputs.environment == 'staging' || inputs.target_env == 'staging') && 'staging' || (github.event_name == 'push' && github.ref_name == 'main') && 'production' || 'staging' }}
      STATE_BUCKET: ${{ vars.PULUMI_STATE_BUCKET || 's3://iac-state-platform-634680389104' }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Configure AWS Credentials (OIDC Federation)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYER_ROLE_ARN || 'arn:aws:iam::634680389104:role/flowwolf-github-deployer-role' }}
          role-session-name: github-actions-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Environment (Node, Python, pnpm, uv)
        uses: ./.github/actions/setup-env

      - name: Pulumi Setup
        uses: ./.github/actions/pulumi-setup
        with:
          state-bucket: ${{ env.STATE_BUCKET }}
          pulumi-config-passphrase: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      # Step 1: Core Network & Database Foundation
      - name: Deploy Foundation (VPC & Networking)
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/foundation
          stack-name: ${{ env.TARGET_ENV }}

      - name: Deploy Data (Aurora RDS & KMS)
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/data
          stack-name: ${{ env.TARGET_ENV }}

      - name: Deploy Platform (ECS Cluster & ECR)
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/platform
          stack-name: ${{ env.TARGET_ENV }}

      # Step 2: Third-Party Images Sync (OpenObserve, Zitadel)
      - name: Sync Third-Party Container Images to ECR
        shell: bash
        run: |
          ./infra/cloud/aws/platform/sync-images.sh "${{ env.TARGET_ENV }}"

      # Step 3: Platform Services & Identity
      - name: Deploy OpenObserve
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/openobserve
          stack-name: ${{ env.TARGET_ENV }}

      - name: Deploy Zitadel Infrastructure
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/zitadel
          stack-name: ${{ env.TARGET_ENV }}

      - name: Deploy Zitadel Configuration
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/zitadel
          stack-name: ${{ env.TARGET_ENV }}

      # Step 4: Tools, Dashboard Infra & Global Routing
      - name: Deploy OpenAS2 Partner Server
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/apps/openas2
          stack-name: ${{ env.TARGET_ENV }}

      - name: Deploy Dashboard Infrastructure (S3 & CloudFront)
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/apps/dashboard
          stack-name: ${{ env.TARGET_ENV }}

      - name: Deploy Global Edge Routing
        uses: ./.github/actions/pulumi-stack-up
        with:
          stack-dir: infra/cloud/aws/apps/routing
          stack-name: ${{ env.TARGET_ENV }}
