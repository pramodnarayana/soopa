name: Continuous Delivery (Staging)

on:
  workflow_run:
    workflows: ["Modular Monolith CI"]
    branches:
      - development
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-staging
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Filter Changed Paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            infra:
              - 'infra/cloud/aws/!(apps)/**'
              - 'infra/cloud/aws/apps/!(api|ucp|edi|migrator)/**'
              - 'infra/cloud/aws/*'
              - 'infra/cloud/zitadel/**'
              - 'versions.env'
              - '.github/workflows/provision-infra.yml'
              - '.github/workflows/preview-infra.yml'
              - '.github/actions/pulumi-*/**'
            apps:
              - 'apps/**'
              - 'core/**'
              - 'Dockerfile'
              - 'infra/cloud/aws/apps/**'

  infra-provision-staging:
    name: Provision Infrastructure (Staging)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.infra == 'true' || needs.detect-changes.outputs.apps == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/provision-infra.yml
    with:
      target_env: staging
      commit_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      skip_if_unchanged: true
      infra_changed: ${{ needs.detect-changes.outputs.infra == 'true' }}
    secrets: inherit

  deploy-staging:
    name: Deploy Applications to AWS (Staging)
    needs: [detect-changes, infra-provision-staging]
    if: (needs.detect-changes.outputs.apps == 'true' || needs.detect-changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch') && !cancelled() && !failure()
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      commit_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
