name: "Staging: Power Management"
run-name: "Staging Power: ${{ inputs.action || (github.event_name == 'schedule' && 'Scheduled Run' || 'Manual') }}"

on:
  schedule:
    # 10:00 PM (16:30 UTC), Mon-Fri: Power down staging environment
    - cron: "30 16 * * 1-5"
    # 9:30 AM (04:00 UTC), Mon-Fri: Power up staging environment for workday
    - cron: "0 4 * * 1-5"
  workflow_dispatch:
    inputs:
      action:
        description: "Power Action to execute on staging"
        required: true
        default: "status"
        type: choice
        options:
          - "start"
          - "stop"
          - "status"

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-power-schedule
  cancel-in-progress: false

jobs:
  manage-power:
    name: "Staging Power Execution"
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure AWS Credentials (OIDC Federation)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYER_ROLE_ARN || 'arn:aws:iam::634680389104:role/flowwolf-github-deployer-role' }}
          role-session-name: github-actions-staging-power-${{ github.run_id }}
          aws-region: us-east-1

      - name: Resolve Action
        id: resolve-action
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "ACTION=$INPUT_ACTION" >> $GITHUB_OUTPUT
            echo "Resolved action from manual trigger: $INPUT_ACTION"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$EVENT_SCHEDULE" = "30 16 * * 1-5" ]; then
              echo "ACTION=stop" >> $GITHUB_OUTPUT
              echo "Resolved action from night schedule ($EVENT_SCHEDULE): stop"
            elif [ "$EVENT_SCHEDULE" = "0 4 * * 1-5" ]; then
              echo "ACTION=start" >> $GITHUB_OUTPUT
              echo "Resolved action from morning schedule ($EVENT_SCHEDULE): start"
            else
              echo "ERROR: Unrecognized schedule expression: '$EVENT_SCHEDULE'" >&2
              exit 1
            fi
          else
            echo "ACTION=status" >> $GITHUB_OUTPUT
            echo "Resolved action to default: status"
          fi

      - name: Execute Power Sequencing
        run: |
          chmod +x ./infra/scripts/manage_staging_power.sh
          ./infra/scripts/manage_staging_power.sh "${{ steps.resolve-action.outputs.ACTION }}" staging
